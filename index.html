function tfRowsRead(){return $$('#tfRows tr.tfrow').map(tr=>{const o={k:tr.dataset.k,l:tr.dataset.l,off:tr.dataset.off===''?null:+tr.dataset.off};$$('[data-f]',tr).forEach(i=>o[i.dataset.f]=i.value);return o})}
function tfAutoHours(){const ini=$('#tfIni')?.value,fim=$('#tfFim')?.value;$$('#tfRows tr.tfrow').forEach(tr=>{const h=$('[data-f=hora]',tr);if(h.value)return;if(tr.dataset.k==='pos'){if(fim)h.value=toHM(toMin(fim)+60)}else if(ini&&tr.dataset.off!=='')h.value=toHM(toMin(ini)+(+tr.dataset.off))})}
function tfCalc(){const f=$('#fTf');if(!f)return;const p=curP();const g=n=>nv(f.querySelector(`[name=${n}]`)?.value);const peso=g('peso'),hr=g('htRec'),ha=g('htAlvo'),hb=g('htBolsa');const comp=f.querySelector('[name=componente]').value;const out=[];
  if(peso&&hr!=null&&ha&&hb&&/Sangue|hemácias/.test(comp)){const k=isGato(p)?60:90;out.push(`<span>Volume estimado <b>${num(peso*k*(ha-hr)/hb,0)} mL</b> <small>(peso × ${k} × (Ht desejado − Ht receptor) ÷ Ht da bolsa)</small></span>`)}
  if(peso&&/Plasma|Crio/.test(comp))out.push(`<span>10 a 20 mL/kg = <b>${num(peso*10,0)} a ${num(peso*20,0)} mL</b></span>`);
  const ti=g('taxaIni'),tm=g('taxaMan');if(peso&&ti)out.push(`<span>Taxa inicial <b>${num(ti*peso,1)} mL/h</b></span>`);if(peso&&tm)out.push(`<span>Após 30 min <b>${num(tm*peso,1)} mL/h</b></span>`);
  const vol=g('volume');if(vol&&peso&&tm)out.push(`<span>Tempo estimado <b>${num(vol/(tm*peso),1)} h</b></span>`);
  $('#tfCalc').innerHTML=out.join('')||'<span>Informe peso, hematócritos e taxas para calcular volume e mL/h</span>'}

/* ---- Escalas de dor ---- */
const ESC={
 glasgow:{nome:'Glasgow CMPS-SF',sigla:'Glasgow',esp:'cao',itens:[
  {k:'vocal',l:'Vocalização (observe no box)',o:[['Quieto',0],['Chorando ou choramingando',1],['Gemendo',2],['Gritando',3]]},

  {k:'mob',l:'Mobilidade (com guia, se puder andar)',opt:'Não avaliada (não pode andar)',o:[['Normal',0],['Manca',1],['Lento ou relutante',2],['Rígido',3],['Recusa-se a andar',4]]},
  {k:'toque',l:'Resposta ao toque (pressão suave a 5 cm ao redor da área)',o:[['Não reage',0],['Vira para olhar',1],['Recua',2],['Rosna ou protege a área',3],['Tenta morder',4],['Chora',5]]},
  {k:'comp',l:'Comportamento geral',o:[['Alegre e satisfeito, ou alegre e ativo',0],['Quieto',1],['Indiferente ou sem resposta ao ambiente',2],['Nervoso, ansioso ou com medo',3],['Deprimido ou sem resposta a estímulos',4]]},
  {k:'post',l:'Postura e atividade',o:[['Confortável',0],['Inquieto',1],['Agitado',2],['Curvado ou tenso',3],['Rígido',4]]}],
  limite:sc=>sc.mob==='na'?{max:20,corte:5}:{max:24,corte:6}},
 ufeps:{nome:'UNESP-Botucatu (forma curta, gatos)',sigla:'UNESP-Botucatu',esp:'gato',itens:[
  {k:'postura',l:'Postura (observe 2 min no box)',o:[['Natural, relaxado ou se move normalmente',0],['Tenso, se move pouco ou reluta em se mover',1],['Curvado e/ou em decúbito dorsolateral',2],['Muda de posição com frequência, inquieto',3]]},
  {k:'misc',l:'Comportamentos diversos (marque os que observar)',multi:['Contrai ou estende os membros pélvicos, ou contrai a musculatura abdominal (flanco)','Olhos parcialmente fechados (ignorar até 1h após a anestesia)','Lambe ou morde a área dolorosa','Movimenta a cauda com força']},
  {k:'atitude',l:'Atitude ao abrir o box (conforto, atividade e atenção)',o:[['Confortável e atento',0],['Quieto e pouco atento',1],['Quieto e desatento, pode ficar de costas',2],['Desconfortável, inquieto, pouco ou nada atento',3]]},
  {k:'palp',l:'Reação à palpação (toque e depois pressão ao redor da área)',opt:'Não foi possível palpar',o:[['Não reage',0],['Não reage ao toque, reage à pressão leve',1],['Reage ao toque e à pressão',2],['Não permite o toque nem a palpação',3]]}],
  limite:sc=>sc.palp==='na'?{max:9,corte:3}:{max:12,corte:4}},
 fgs:{nome:'Escala de Grimace Felina',sigla:'Grimace',esp:'gato',itens:[
  {k:'orelha',l:'Posição das orelhas',o:[['Voltadas para a frente',0],['Levemente afastadas',1],['Achatadas e voltadas para fora',2]]},
  {k:'olhos',l:'Aperto orbital (olhos)',o:[['Abertos',0],['Parcialmente fechados',1],['Semicerrados, apertados',2]]},
  {k:'focinho',l:'Tensão do focinho',o:[['Relaxado, arredondado',0],['Levemente tenso',1],['Tenso, elíptico',2]]},
  {k:'bigodes',l:'Posição dos bigodes',o:[['Soltos e curvos',0],['Levemente curvos ou retos',1],['Retos e voltados para a frente',2]]},
  {k:'cabeca',l:'Posição da cabeça',o:[['Acima da linha dos ombros',0],['Alinhada aos ombros',1],['Abaixo dos ombros ou inclinada para baixo',2]]}],
  limite:()=>({max:10,corte:4})}};
function escScore(tipo,sc){const E=ESC[tipo];let t=0;for(const it of E.itens){const v=sc[it.k];if(it.multi)t+=Math.min((v||[]).length,3);else if(typeof v==='number')t+=v}const L=E.limite(sc);
  const done=E.itens.every(it=>it.multi||sc[it.k]!=null);return{total:t,...L,resgate:t>=L.corte,completa:done}}
const escImg=(tipo,k,v)=>S.escImgs[`${tipo}__${k}__${v}`]?.asset;
function escForm(tipo,sc){const E=ESC[tipo];
  return`<div class="esc" data-tipo="${tipo}"><div class="muted small">${E.nome}</div>${E.itens.map(it=>`<div class="esc-it"><b>${it.l}</b><div class="esc-o">${
    it.multi?it.multi.map((m,i)=>`<label class="eo"><input type="checkbox" data-ek="${it.k}" value="${i}" ${(sc[it.k]||[]).includes(i)?'checked':''}>${escImg(tipo,it.k,i)?`<img src="_blob/${esc(escImg(tipo,it.k,i))}" alt="">`:''}<span>${esc(m)}</span></label>`).join('')
    :it.o.map(([l,v])=>`<label class="eo"><input type="radio" name="es_${it.k}" data-ek="${it.k}" value="${v}" ${sc[it.k]===v?'checked':''}>${escImg(tipo,it.k,v)?`<img src="_blob/${esc(escImg(tipo,it.k,v))}" alt="">`:''}<span><b class="tnum">${v}</b> ${esc(l)}</span></label>`).join('')+(it.opt?`<label class="eo"><input type="radio" name="es_${it.k}" data-ek="${it.k}" value="na" ${sc[it.k]==='na'?'checked':''}><span>${esc(it.opt)}</span></label>`:'')}</div></div>`).join('')}
   <div class="esc-res" id="escRes"></div></div>`}
function escRead(box){const tipo=box.dataset.tipo;const sc={};for(const it of ESC[tipo].itens){if(it.multi)sc[it.k]=$$(`[data-ek=${it.k}]:checked`,box).map(i=>+i.value);else{const v=$(`[data-ek=${it.k}]:checked`,box)?.value;if(v!=null)sc[it.k]=v==='na'?'na':+v}}return{tipo,sc}}
function escUpdate(box){const{tipo,sc}=escRead(box);const r=escScore(tipo,sc);
  $('#escRes').innerHTML=`<b class="tnum">${r.total}/${r.max}</b> · ponto de corte ${r.corte}${r.completa?'':' · <span class="muted">preencha todos os itens</span>'} ${r.resgate?'<span class="chip crit">Resgate analgésico indicado</span>':r.completa?'<span class="chip ok">Abaixo do ponto de corte</span>':''}`;
  $('#escalaJson').value=r.completa||r.total?JSON.stringify({tipo,sigla:ESC[tipo].sigla,sc,total:r.total,max:r.max,corte:r.corte,resgate:r.resgate}):''}
function escWire(e,p){const host=$('#escHost');if(!host)return;
  const show=tipo=>{host.innerHTML=escForm(tipo,e.escala?.tipo===tipo?e.escala.sc:{});$$('[data-scale]').forEach(b=>b.classList.toggle('pri',b.dataset.scale===tipo));const box=$('.esc',host);box.addEventListener('change',()=>escUpdate(box));escUpdate(box)};
  $$('[data-scale]').forEach(b=>b.onclick=()=>show(b.dataset.scale));
  $('#escNone').onclick=()=>{host.innerHTML='';$('#escalaJson').value='';$$('[data-scale]').forEach(b=>b.classList.remove('pri'))};

function plantaoData(p){
  const t=today();const pr=S.prescHoje[p.id];const mk=S.execHoje[p.id]||{};const now=toMin(nowHM());const late=[],next=[];let tot=0,ok=0;
  if(pr)for(const it of (pr.itens||[]).filter(i=>i.tipo!=='fluido'&&!i.suspenso))for(const h of horarios(it)){tot++;const m=mk[it.id+'|'+h];if(m?.s)ok++;else{const nm=it.tipo==='fluido'?'Soroterapia':it.nome;if(toMin(h)<=now-15)late.push(h+' '+nm);else if(toMin(h)<=now+240)next.push(h+' '+nm)}}
  const ev=[...(S.evoHoje[p.id]||[])].sort((a,b)=>String(b.hora).localeCompare(String(a.hora)));const e=ev[0];const sl=evoSlots(t,S.evoHoje[p.id]||[]);
  const sol=solOf(p.id).filter(solAberta);const nota=S.notas.filter(n=>n.internacaoId===p.id).sort((a,b)=>String(b.em).localeCompare(String(a.em)))[0];
  const d=Math.floor((Date.now()-new Date(p.entrada).getTime())/864e5)+1;
  const inter=S.interRec.filter(x=>x.internacaoId===p.id&&(x.data===t||x.data===addDays(t,-1))).sort((a,b)=>String(b.data+b.inicio).localeCompare(String(a.data+a.inicio)));
  return{pr,tot,ok,late,next,e,sl,sol,nota,d,inter}}

function plantaoTexto(){const turno=$('#plTurno')?.value||turnoAtual();const L=[`PASSAGEM DE PLANTÃO · ${fmtD(today())} · ${turno}`,''];

    L.push(`  Hoje: ${x.ok}/${x.tot} itens · evolução ${x.sl.filter(s=>s.e).length}/3`);
    if(x.late.length)L.push('  Atrasados: '+x.late.join(', '));if(x.next.length)L.push('  Próximas 4h: '+x.next.join(', '));

    if(x.sol.length)L.push('  Pendências: '+x.sol.map(s=>s.item+' ('+s.status+')').join(', '));

  let y=16;doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(L(`Passagem de plantão · ${fmtD(today())} · ${$('#plTurno')?.value||turnoAtual()}`),14,y);y+=8;doc.setFontSize(9);

/* Montar pacote */
function modalSigNew(){const p=curP();const ms=S.modelosDoc.filter(m=>m.ativo!==false&&!m.impresso).sort((a,b)=>DOC_CATS.indexOf(a.categoria)-DOC_CATS.indexOf(b.categoria)||String(a.codigo||'zz').localeCompare(String(b.codigo||'zz'),'pt',{numeric:true})||a.nome.localeCompare(b.nome));

   <label class="f">Preparado por<select class="inp" name="criadoPor"><option value="">—</option>${S.equipe.filter(e=>e.ativo!==false).map(e=>`<option value="${e.id}" ${lsGet('vp_resp','')===e.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select></label>
  </form><div class="modal-f"><button class="btn" data-act="close">Cancelar</button><button class="btn" id="sigSave">Salvar para depois</button><button class="btn pri" id="sigGo">Prosseguir ${ic('right')}</button></div>`,'wide');
  const make=async go=>{const fd=new FormData($('#fSigN'));const ids=fd.getAll('doc');if(!ids.length){toast('Marque pelo menos um documento');return}
    const docs=ids.map(id=>{const m=byId(S.modelosDoc,id);return{modeloId:id,nome:m.nome,categoria:m.categoria||'',modelo:m.texto}});
    try{const ref=S.db.collection('assinaturas').doc();await ref.set({internacaoId:p.id,docs,procedimento:fd.get('procedimento')||'',dataProc:fd.get('dataProc')||today(),criadoPor:fd.get('criadoPor')||null,criadoEm:nowDT(),status:'pendente',por:S.uid||null});closeModal();if(go)setTimeout(()=>modalSigPrep(ref.id),120);else toast('Pacote salvo')}catch(e){fail(e)}};
  $('#sigSave').onclick=()=>make(false);$('#sigGo').onclick=()=>make(true);
}

/* Modo tutor: dados → cada documento → assinatura única */
function tutorFlow(sid){const s=S.assin.find(x=>x.id===sid);const p=byId(S.intern,s?.internacaoId);if(!s||!p){toast('Pacote não encontrado. Tente de novo em instantes.');return}
  if(s.status==='pendente'){modalSigPrep(sid);return}const frozen=s.status==='pronto';
  const st={step:0,tutor:frozen&&s.tutor?{...s.tutor}:{nome:p.tutor||'',cpf:p.cpf||'',email:p.emailTutor||'',telefone:p.telefone||'',endereco:p.endereco||'',cidade:p.cidadeTutor||'',uf:p.ufTutor||''},aceite:{},foto:null};const N=s.docs.length;
  const draw=()=>{const ctx=phCtx(p,st.tutor,s);let body='';
    if(st.step===0&&frozen)body=`<div class="tf-step">Confira os dados</div><div class="doc-id big">${docHeader(ctx).split('\n').slice(1).filter(Boolean).map(l=>`<div>${esc(l)}</div>`).join('')}</div>
      <div class="muted">Você vai ler e aceitar ${N} documento(s) e assinar uma vez. Se algum dado estiver errado, avise a equipe antes de começar.</div>`;
    else if(st.step===0)body=`<div class="tf-step">Seus dados</div><div class="grid g2">
      <label class="f spanall">Nome completo *<input class="inp" id="tNome" value="${esc(st.tutor.nome)}" autocomplete="name"></label>
      <label class="f">CPF *<input class="inp mono" id="tCpf" inputmode="numeric" value="${esc(cpfMask(st.tutor.cpf))}"></label>
      <label class="f">WhatsApp com DDD * <span class="muted" style="font-weight:400">(para confirmar a assinatura)</span><input class="inp" id="tTel" inputmode="tel" value="${esc(foneFmt(st.tutor.telefone))}" placeholder="(11) 98765-4321"></label>
      <label class="f spanall">E-mail (opcional)<input class="inp" id="tEmail" type="email" inputmode="email" value="${esc(st.tutor.email)}" autocomplete="email"></label>
      <label class="f spanall">Endereço completo (rua, nº, bairro, CEP) *<input class="inp" id="tEnd" value="${esc(st.tutor.endereco)}" autocomplete="street-address"></label>
      <label class="f">Cidade *<input class="inp" id="tCid" value="${esc(st.tutor.cidade)}" autocomplete="address-level2"></label>
      <label class="f">Estado (UF) *<input class="inp" id="tUf" maxlength="2" value="${esc(st.tutor.uf)}" autocomplete="address-level1"></label></div>
      <div class="muted small">Paciente: <b>${esc(p.nome)}</b> · ${esc([p.especie,p.raca].filter(Boolean).join(' · '))}. Você vai ler e aceitar ${N} documento(s) e assinar uma vez.</div>`;
    else if(st.step<=N){const d=s.docs[st.step-1];body=`<div class="tf-step">Documento ${st.step} de ${N}</div><h3 style="font-size:20px">${esc(d.nome)}</h3>
      <div class="tf-doc" id="tfDoc">${docHTML2(frozen&&d.texto?d.texto:fillDoc(d.modelo,ctx))}</div>
      <label class="chk tf-ok"><input type="checkbox" id="tAceite" ${st.aceite[st.step-1]?'checked':''}><span>Li e concordo com <b>${esc(d.nome)}</b></span></label>`}
    else body=`<div class="tf-step">Assinatura</div><div class="muted">Sua assinatura vale para os ${N} documentos que você aceitou:</div><ol class="small" style="margin:4px 0 0">${s.docs.map(d=>`<li>${esc(d.nome)}</li>`).join('')}</ol>
      <div class="sigpad-w"><canvas id="sigPad" aria-label="Área de assinatura"></canvas><span class="sigline">Assine com o dedo acima da linha</span></div>
      <div class="row"><button type="button" class="btn sm" id="sigClr">Limpar assinatura</button><span class="spacer"></span>
       <label class="btn sm">${ic('cam')}${st.foto?'Trocar foto':'Tirar foto (opcional)'}<input type="file" id="tFoto" accept="image/*" capture="user" hidden></label>${st.foto?`<img src="${st.foto}" alt="Foto do tutor" style="width:48px;height:48px;object-fit:cover;border-radius:8px">`:''}</div>
      <div class="muted small">${esc(st.tutor.nome)} · CPF ${esc(cpfMask(st.tutor.cpf))} · ${fmtDT(nowDT())}</div>`;
    const dots=[...Array(N+2).keys()].map(i=>`<span class="${i<st.step?'d':i===st.step?'c':''}"></span>`).join('');
    $('#modalRoot').innerHTML=`<div class="ov tutor-ov"><div class="modal wide tutor" role="dialog" aria-modal="true" aria-label="Assinatura de documentos">
      <div class="modal-h"><h2>${esc(S.clinica?.nome||'VETPLUS LTDA')} · Documentos</h2><div class="dots">${dots}</div><button class="btn icon ghost" id="tfX" aria-label="Fechar">${ic('x')}</button></div>
      <div class="modal-b">${body}</div>
      <div class="modal-f">${st.step>0?'<button class="btn" id="tfBack">Voltar</button>':''}<span class="spacer"></span><button class="btn pri" id="tfNext">${st.step===0?'Começar':st.step<=N?(st.step===N?'Ir para a assinatura':'Próximo documento'):`${ic('check')}Assinar ${N} documento(s)`}</button></div></div></div>`;
    $('#tfX').onclick=()=>{closeModal();toast('Pacote salvo. Dá para continuar depois em Documentos.')};
    if($('#tfBack'))$('#tfBack').onclick=()=>{st.step--;draw()};
    if(st.step>N)padInit();
    if($('#tFoto'))$('#tFoto').onchange=async e=>{const f=e.target.files[0];if(!f)return;const b=await shrinkImg(f,480);st.foto=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});const sig=$('#sigPad').toDataURL();draw();padLoad(sig)};
    $('#tfNext').onclick=async()=>{
      if(st.step===0&&frozen){st.step++;draw();return}
      if(st.step===0){st.tutor={nome:$('#tNome').value.trim(),cpf:$('#tCpf').value.replace(/\D/g,''),telefone:$('#tTel').value.trim(),email:$('#tEmail').value.trim(),endereco:$('#tEnd').value.trim(),cidade:$('#tCid').value.trim(),uf:$('#tUf').value.trim().toUpperCase()};
        if(st.tutor.nome.split(/\s+/).length<2){toast('Informe o nome completo');$('#tNome').focus();return}
        if(!cpfOk(st.tutor.cpf)){toast('CPF inválido. Confira os números.');$('#tCpf').focus();return}
        if(!st.tutor.endereco){toast('Informe o endereço completo');$('#tEnd').focus();return}
        if(!st.tutor.cidade){toast('Informe a cidade');$('#tCid').focus();return}
        if(!/^[A-Z]{2}$/.test(st.tutor.uf)){toast('Informe o estado com 2 letras (ex.: CE)');$('#tUf').focus();return}
        const dt=st.tutor.telefone.replace(/\D/g,'').replace(/^55(?=\d{10,11}$)/,'');if(dt.length<10||dt.length>11){toast('Informe o WhatsApp com DDD');$('#tTel').focus();return}
        if(st.tutor.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(st.tutor.email)){toast('E-mail inválido. Corrija ou deixe em branco.');$('#tEmail').focus();return}
        st.step++;draw();return}
      if(st.step<=N){if(!$('#tAceite').checked){toast('Marque "Li e concordo" para continuar');return}st.aceite[st.step-1]=nowDT();st.step++;draw();return}
      if(!padHasInk()){toast('Assine na área indicada');return}
      $('#tfNext').disabled=true;
      try{const ctx=phCtx(p,st.tutor,s);const assinadoEm=nowDT();
        const docs=await Promise.all(s.docs.map(async(d,i)=>{const texto=frozen&&d.texto?d.texto:fillDoc(d.modelo,ctx);return{modeloId:d.modeloId,nome:d.nome,categoria:d.categoria,texto,hash:await sha256(texto),aceitoEm:st.aceite[i]}}));
        const codigo=novoCodigo();const exp=new Date(Date.now()+864e5);
        const assinatura=padData();const hashPacote=await sha256(docs.map(d=>d.hash).join('|')+'|'+st.tutor.cpf+'|'+assinadoEm+'|'+codigo);
        await S.db.doc('assinaturas/'+sid).update({docs,tutor:st.tutor,assinatura,foto:st.foto||null,assinadoEm,codigo,codigoEm:assinadoEm,expiraEm:frozen?null:exp.toISOString(),status:frozen?'assinado':'aguardando',dispositivo:navigator.userAgent.slice(0,180),hashPacote});
        try{await S.db.doc('internacoes/'+p.id).update({emailTutor:p.emailTutor||st.tutor.email||'',cpf:p.cpf||st.tutor.cpf,tutor:p.tutor||st.tutor.nome,telefone:p.telefone||st.tutor.telefone})}catch(_){}
        setTimeout(()=>frozen?modalSigPapel(sid):showQR(sid),150)}catch(e){$('#tfNext').disabled=false;fail(e)}};
  };draw();
}
let PAD=null;
function padInit(){const c=$('#sigPad');const r=c.getBoundingClientRect();const dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0d2a33';
  PAD={c,x,ink:0,down:false};const pos=e=>{const b=c.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);PAD.down=true;const[a,b]=pos(e);x.beginPath();x.moveTo(a,b);e.preventDefault()};
  c.onpointermove=e=>{if(!PAD.down)return;const[a,b]=pos(e);x.lineTo(a,b);x.stroke();PAD.ink++;e.preventDefault()};
  c.onpointerup=c.onpointercancel=()=>{PAD.down=false};
  $('#sigClr').onclick=()=>{x.clearRect(0,0,c.width,c.height);PAD.ink=0}}
function padLoad(url){if(!url||!PAD)return;const im=new Image();im.onload=()=>{const r=PAD.c.getBoundingClientRect();PAD.x.drawImage(im,0,0,r.width,r.height);PAD.ink=Math.max(PAD.ink,1)};im.src=url}
const padHasInk=()=>PAD&&PAD.ink>8;
function padData(){const c=PAD.c;const o=document.createElement('canvas');o.width=Math.min(c.width,900);o.height=Math.round(c.height*o.width/c.width);const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);x.drawImage(c,0,0,o.width,o.height);return o.toDataURL('image/png')}

/* Confirmação pelo WhatsApp do tutor (link wa.me, sem custo) */
const foneBR=t=>{let d=String(t||'').replace(/\D/g,'');if(!d)return'';if(!(d.startsWith('55')&&d.length>=12))d='55'+d;return d};
const foneFmt=t=>{const d=foneBR(t).slice(2);return d.length===11?`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`:d.length===10?`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`:t||''};
function confirmMsg(s,p){return`CONFIRMO a assinatura dos documentos do paciente ${p.nome}.\nTutor: ${s.tutor.nome}, CPF ${cpfMask(s.tutor.cpf)}\nAssinado em ${fmtDT(s.assinadoEm)}:\n${s.docs.map((d,i)=>`${i+1}. ${d.nome}`).join('\n')}\nCódigo: ${s.codigo}`}
function linksOf(s,p){const cl=S.clinica||{};const zc=foneBR(cl.whatsapp);const msg=confirmMsg(s,p);
  const conf=zc?`https://wa.me/${zc}?text=${encodeURIComponent(msg)}`:'';
  const val=new Date(s.expiraEm).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
  const toTutor=`Olá, ${s.tutor.nome.split(' ')[0]}! Aqui é da ${cl.nome||'VETPLUS'}.\nPara confirmar a assinatura dos documentos do ${p.nome}, toque no link abaixo e depois em *Enviar*:\n\n${conf}\n\nCódigo: ${s.codigo} (válido até ${val}).`;
  const zt=foneBR(s.tutor.telefone);
  return{conf,msg,val,toTutor,tutorLink:zt?`https://wa.me/${zt}?text=${encodeURIComponent(toTutor)}`:'',mail:mailtoOf(s,p)}}
function mailtoOf(s,p){const cl=S.clinica||{};const subj=`Confirmação de assinatura ${s.codigo} - ${p.nome}`;const body=confirmMsg(s,p);return{to:cl.email||'',subj,body,url:`mailto:${cl.email||''}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`}}
async function showQR(sid){const s=S.assin.find(x=>x.id===sid);const p=byId(S.intern,s?.internacaoId);if(!s||!p||!s.codigo){toast('Aguarde um instante e tente de novo');return}

  openModal(`${H('Confirmação pelo WhatsApp do tutor')}<div class="modal-b" style="align-items:center;text-align:center">
   ${k.conf?'':'<div class="banner warn">Cadastre o WhatsApp da clínica em Cadastros › Clínica para gerar o link.</div>'}
   <div class="tf-step">Pronto! Falta só confirmar</div>

     ${k.tutorLink?`<a class="btn pri" href="${esc(k.tutorLink)}" target="_blank" rel="noopener">${ic('copy')}Enviar link pelo WhatsApp</a>`:'<span class="muted small">Telefone do tutor não informado.</span>'}
     <button class="btn sm" type="button" id="qrCopyT">Copiar mensagem para o tutor</button></div>
   </div>
   <details style="width:100%;text-align:left"><summary class="small">Prefere e-mail? Ou o link não abriu?</summary>
    <div class="small" style="margin-top:8px">O tutor pode mandar este texto pelo WhatsApp para <b class="mono">${esc(foneFmt(S.clinica?.whatsapp)||'—')}</b>${S.clinica?.email?` ou por e-mail para <b class="mono">${esc(S.clinica.email)}</b>`:''}:</div>

async function sigPDF(sid,obj){const s=obj||S.assin.find(x=>x.id===sid);const p=byId(S.intern,s.internacaoId);if(!S.downloads){toast('Não foi possível preparar o arquivo. Recarregue a página');return}

  const L=t=>String(t??'').replace(/[–—]/g,'-').replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/…/g,'...').replace(/[^\x00-\xFF]/g,'');

  const sigBlock=d=>{if(y>BOT-48){doc.addPage();head()}y+=4;doc.setDrawColor(205,222,222);doc.setFillColor(247,251,251);doc.roundedRect(M,y,PW-2*M,44,2,2,'FD');
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text(L(s.remoto?'Aprovação a distância · WhatsApp do tutor':'Li e concordo · aceite eletrônico'),M+4,y+6);
    if(s.assinatura)doc.addImage(s.assinatura,'PNG',M+4,y+9,62,20);else if(s.remoto){doc.setFont('helvetica','normal');doc.setFontSize(8.4);doc.text(doc.splitTextToSize(L(st==='confirmado'?`Aprovado pelo tutor em ${fmtDT(s.confirmadoEm)}, por mensagem "ACEITO ${s.codigo}" enviada do WhatsApp ${foneFmt(s.tutor.telefone)}.`:`Para aprovar, responda no WhatsApp: ACEITO ${s.codigo}`),62),M+4,y+12)}doc.setDrawColor(120,140,145);doc.line(M+4,y+30,M+70,y+30);
    doc.setFont('helvetica','normal');doc.setFontSize(8.4);doc.text(L(s.tutor.nome),M+4,y+34.5);doc.text(L('CPF '+cpfMask(s.tutor.cpf)),M+4,y+38.5);
    const r=[['Aceito em',d.aceitoEm?fmtDT(d.aceitoEm):'aguardando'],s.remoto?['Enviado em',fmtDT(s.enviadoEm)]:['Assinado em',fmtDT(s.assinadoEm)],['Código',s.codigo],['Confirmação',st==='confirmado'?(s.canal||'e-mail')+' em '+fmtDT(s.confirmadoEm):'pendente'],['Integridade (SHA-256)',d.hash.slice(0,32)],['',d.hash.slice(32)]];
    r.forEach(([k,v],i)=>{doc.setTextColor(110,135,140);doc.text(L(k),M+78,y+8+i*5.6);doc.setTextColor(20,48,58);doc.setFont(k===''||k.startsWith('Integ')?'courier':'helvetica',k?'bold':'bold');doc.text(L(v),M+112,y+8+i*5.6);doc.setFont('helvetica','normal')});y+=48};

  if(s.remoto&&st!=='confirmado'){startDoc('Como aprovar estes documentos',IDF,false);doc.setFontSize(11);doc.setFont('helvetica','normal');

  s.docs.forEach((d,i)=>{const sp=splitIdent(d.texto||'');startDoc(d.nome,sp.ident,!!(i||(s.remoto&&st!=='confirmado')));para(sp.body);
    if(prev){if(y>BOT-20){doc.addPage();head()}y+=4;doc.setDrawColor(213,227,227);doc.setFillColor(247,251,251);doc.roundedRect(M,y,PW-2*M,14,2,2,'FD');doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(7,115,105);doc.text(L('Documento para leitura prévia'),M+4,y+5.5);doc.setFont('helvetica','normal');doc.setTextColor(20,48,58);doc.text(L('A assinatura será feita presencialmente na clínica, no tablet, após a leitura de cada termo.'),M+4,y+10.5);y+=18}else sigBlock(d)});

  doc.setFontSize(9.5);for(const[k,v]of kv){if(!v)continue;doc.setFont('helvetica','normal');doc.setTextColor(110,135,140);doc.text(L(k),M,y);doc.setTextColor(20,48,58);doc.setFont(k.startsWith('Hash')||k==='Código único'?'courier':'helvetica','bold');const ls=doc.splitTextToSize(L(v),PW-2*M-48);doc.text(ls,M+48,y);y+=ls.length*4.6+1.6}
  y+=4;doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('Documentos e códigos de integridade',M,y);y+=6;doc.setFontSize(8.6);
  s.docs.forEach((d,i)=>{doc.setFont('helvetica','normal');doc.text(L(`${i+1}. ${d.nome} · aceito em ${fmtDT(d.aceitoEm)}`),M,y);y+=4.2;doc.setFont('courier','normal');doc.text(d.hash,M+4,y);y+=6});
  if(s.foto){y+=2;doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('Foto no momento da assinatura',M,y);y+=3;try{doc.addImage(s.foto,'JPEG',M,y,32,32)}catch(_){}y+=36}

  doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(110,135,140);
  for(const ln of doc.splitTextToSize(L(s.remoto?'Os documentos foram enviados ao tutor em PDF, já preenchidos com os dados dele e do paciente. A aprovação foi feita a distância, pela resposta "ACEITO" com o código único, enviada do WhatsApp do tutor dentro do prazo de validade (assinatura eletrônica simples, MP 2.200-2/2001, art. 10, § 2º). O código de integridade (SHA-256) muda se qualquer letra do texto for alterada.':'Cada documento foi lido e aceito individualmente pelo tutor e assinado uma única vez no dispositivo da clínica. O código de integridade (SHA-256) muda se qualquer letra do texto for alterada. A autoria foi confirmada pelo envio do código único a partir do WhatsApp (ou e-mail) do tutor, dentro do prazo de validade.'),PW-2*M)){doc.text(ln,M,y);y+=3.8}
  docFooters(doc,K,RNG,s.codigo?'Código '+s.codigo:'');

function eutVol(r,peso){const d=nv(r.dose),c=nv(r.conc);if(d==null)return null;const u=r.un||'mg/kg';
  if(u==='mL/kg')return peso?d*peso:null;if(u==='mL (volume total)')return d;if(!c)return null;
  if(u==='mg/kg'||u==='mEq/kg')return peso?d*peso/c:null;if(u==='µg/kg')return peso?d*peso/1000/c:null;if(u==='mg (dose total)')return d/c;return null}

const normN=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function medExtra(it){if(!it||it.tipo!=='med')return false;const m=(it.medId&&byId(S.meds,it.medId))||S.meds.find(x=>normN(x.nome)===normN(it.nome));return !!(m?.extra||it.extra)}
const needsAut=it=>medExtra(it)&&!it.suspenso&&it.autTutor?.status!=='autorizado';
function autChip(it){if(!medExtra(it))return'';const a=it.autTutor;

  if(a?.status==='recusado')return` <span class="chip aut no" title="Tutor não autorizou em ${esc(fmtDT(a.em))}">$ tutor não autorizou</span>`;
  return` <span class="chip aut wait">$ aguardando autorização</span>`}

/* Cancelar protocolo lançado por engano: os itens ficam marcados como cancelados (não são apagados) */
function protLotes(pr){const m={};for(const it of pr?.itens||[]){if(!it.protocolo||it.cancelado)continue;const k=it.lote||('nome:'+it.protocolo);(m[k]=m[k]||{k,nome:it.protocolo,n:0}).n++}return Object.values(m)}
function modalProtCancel(k){const p=curP();const pr=S.pPresc[S.day];const its=(pr?.itens||[]).filter(it=>!it.cancelado&&(it.lote||('nome:'+it.protocolo))===k);if(!its.length)return;
  const mk=S.pExec[S.day]?.marks||{};const feitos=Object.keys(mk).filter(x=>its.some(it=>x.startsWith(it.id+'|'))&&mk[x]?.s==='ok').length;
  openModal(`${H('Cancelar protocolo · '+esc(its[0].protocolo))}<form class="modal-b" id="fPC" onsubmit="return false">
   <div class="muted small">${esc(p.nome)} · ${fmtD(S.day)}</div>
   <div>Os ${its.length} itens deste protocolo saem do mapa de execução. Eles não são apagados: ficam riscados na prescrição como <b>cancelados</b>, com quem cancelou e o motivo, e não são copiados para os próximos dias.</div>
   <ul class="small" style="margin:0;padding-left:18px">${its.map(it=>`<li>${esc(it.nome||'Soroterapia')}</li>`).join('')}</ul>
   ${feitos?`<div class="banner warn small">${ic('flag')}<span>${feitos} aplicação(ões) destes itens já foram registradas hoje. Os registros continuam no mapa.</span></div>`:''}
   <div class="grid g2"><label class="f">Cancelado por *<select class="inp" name="por" id="pcPor"><option value="">Selecione</option>${S.equipe.filter(e=>e.ativo!==false).map(e=>`<option value="${e.id}" ${lsGet('vp_presc','')===e.id?'selected':''}>${esc(e.nome)}</option>`).join('')}</select></label>
   <label class="f">Motivo<input class="inp" name="motivo" value="Lançado por engano"></label></div>
  </form><div class="modal-f"><button class="btn" data-act="close">Voltar</button><button class="btn danger-pri" id="pcOk">Cancelar protocolo</button></div>`);
  $('#pcOk').onclick=async()=>{const fd=formData('#fPC');if(!fd.por&&S.equipe.length){toast('Selecione quem está cancelando');$('#pcPor').focus();return}
    const ids=new Set(its.map(x=>x.id));const c={em:nowDT(),por:fd.por||null,motivo:fd.motivo||''};
    const itens=pr.itens.map(it=>ids.has(it.id)?{...it,suspenso:true,cancelado:c}:it);
    try{await S.db.doc(`prescricoes/${p.id}_${S.day}`).update({itens,editadoEm:nowDT()});closeModal();toast('Protocolo cancelado')}catch(e){fail(e)}}}
Object.assign(ACT,{protCancel(el){modalProtCancel(el.dataset.k)}});

/* Hidratação e alerta de defecação */
const HID_VIAS=['Bebeu sozinho','Via sonda','Fluidoterapia SC','Fluidoterapia IV'];
function ultDefecDe(p){let t=p.ultDefec||'';if(p.id===S.pid)for(const e of S.pEvo)if(e.fezes==='Defecou'){const x=e.data+'T'+e.hora;if(x>t)t=x}return t}
function defecAlerta(p){if(!p||p.status==='alta')return null;const ult=ultDefecDe(p);const ref=ult||p.entrada;if(!ref)return null;
  const h=Math.floor((Date.now()-new Date(ref))/36e5);if(h<24)return null;
  return{h,ult,txt:`Paciente está há ${h>=48?Math.floor(h/24)+' dias':h+' horas'} sem defecar`,sub:ult?`Última defecação registrada: ${fmtDT(ult)}`:`Nenhuma defecação registrada desde a entrada (${fmtDT(p.entrada)})`}}
function defecBanner(p){const a=defecAlerta(p);if(!a)return'';return`<div class="banner alerta" role="status">${ic('flag')}<div><b>${esc(a.txt)}</b><div class="small">${esc(a.sub)} · O alerta some sozinho quando uma evolução registrar “Defecou”.</div></div></div>`}
function defecTag(p){const a=defecAlerta(p);return a?` <span class="chip warn" title="${esc(a.sub)}">${a.h>=48?Math.floor(a.h/24)+' dias':a.h+'h'} sem defecar</span>`:''}

   </div></div>`}
function plDitar(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(REC){try{REC.stop()}catch(_){}return}
  if(!SR){toast('Ditado por voz indisponível neste navegador. Use o microfone do teclado do tablet.');return}
  const r=new SR();r.lang='pt-BR';r.continuous=true;r.interimResults=true;const base=($('#plRel')?.value||'').trim();let fin='';
  r.onresult=e=>{let it='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t+' ';else it+=t}const v=(base?base+' ':'')+fin+it;const ta=$('#plRel');if(ta)ta.value=v;S.plDraft.txt=v};
  r.onerror=e=>{toast(['not-allowed','service-not-allowed','audio-capture'].includes(e.error)?'O microfone não foi liberado nesta tela. Use o 🎤 do teclado do tablet para ditar.':'Ditado interrompido. Tente de novo.')};
  r.onend=()=>{REC=null;const b=$('#plMic');if(b){b.classList.remove('rec');b.innerHTML=ic('mic')+'Ditar'}};
  try{r.start();REC=r;const b=$('#plMic');if(b){b.classList.add('rec');b.innerHTML=ic('mic')+'Parar ditado'}toast('Pode falar…')}catch(e){REC=null;toast('Não foi possível abrir o microfone. Use o 🎤 do teclado do tablet.')}}
async function plOrganizar(){const t=($('#plRel')?.value||'').trim();if(!t){toast('Escreva ou dite o relato primeiro');$('#plRel')?.focus();return}
  if(!S.sample){toast('A IA ainda não foi configurada. O master configura no menu da conta › Configurar IA');return}
  const turno=$('#plTurno')?.value||turnoAtual();const nomes=ativos().map(p=>`${p.nome} (${[p.especie,p.box?'box '+p.box:''].filter(Boolean).join(', ')})`).join('; ');
  const prompt=`Você organiza passagens de plantão da internação de um hospital veterinário.
Reescreva o relato abaixo em português do Brasil de forma OBJETIVA, PROFISSIONAL e NEUTRA:
- retire agressividade, ironia, desabafos, reclamações pessoais e julgamentos sobre colegas ou tutores, mantendo apenas o fato clínico ou operacional;
- organize por paciente: o nome do paciente sozinho numa linha, seguido de tópicos começando com "- " (estado atual, o que foi feito, pendências, o que observar ou fazer nas próximas horas), só quando o relato trouxer essa informação;
- no fim, um bloco "Geral" para o que não for de um paciente específico (estoque, equipamentos, recados);
- mantenha EXATAMENTE doses, volumes, horários e números; não invente nada; se algo estiver ambíguo, escreva "(confirmar)";
- texto curto, sem introdução, sem despedida e sem outra formatação além dos tópicos.
Pacientes internados agora: ${nomes||'—'}. Turno: ${turno}.

Relato:
"""${t}"""`;
  const w=$('#plOrgW'),ta=$('#plOrg');if(w)w.hidden=false;if(ta)ta.value='Organizando…';
  try{const r=await S.sample(prompt,{onText:({text})=>{const x=$('#plOrg');if(x)x.value=text}});S.plDraft.org=r.text;const x=$('#plOrg');if(x)x.value=r.text}
  catch(e){if(ta)ta.value=S.plDraft.org||'';toast(e?.code==='rate_limited'?'Muitas solicitações. Aguarde um pouco.':e?.code==='not_granted'?'A IA não foi autorizada nesta tela.':'Não foi possível organizar agora.')}}

/* ===== Exportar prontuário em Word (.docx), a partir dos mesmos blocos do PDF */
const DOCXJS='https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js';
async function saveDocx(WB,p){try{await loadScript(DOCXJS)}catch(e){toast('Não foi possível carregar o gerador de Word. Tente de novo.');return}
  const D=window.docx;const {Document,Packer,Paragraph,TextRun,Table,TableRow,TableCell,WidthType,ImageRun,AlignmentType,Header,Footer,PageNumber,ShadingType,BorderStyle,HeadingLevel}=D;
  const cl=S.clinica||{};const F='Calibri';
  const b64=u=>{const s=atob(String(u).split(',')[1]||'');const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a};
  const T=(t,o={})=>new TextRun({text:String(t??''),font:F,size:o.size||20,bold:!!o.bold,italics:!!o.it,color:o.color||'13303A'});
  const P=(ch,o={})=>new Paragraph({children:Array.isArray(ch)?ch:[ch],spacing:{before:o.before||0,after:o.after??80},heading:o.h,alignment:o.al,keepNext:o.keep});
  const NB={top:{style:BorderStyle.NONE,size:0,color:'FFFFFF'},bottom:{style:BorderStyle.NONE,size:0,color:'FFFFFF'},left:{style:BorderStyle.NONE,size:0,color:'FFFFFF'},right:{style:BorderStyle.NONE,size:0,color:'FFFFFF'}};
  const GB={top:{style:BorderStyle.SINGLE,size:4,color:'CDDEDE'},bottom:{style:BorderStyle.SINGLE,size:4,color:'CDDEDE'},left:{style:BorderStyle.SINGLE,size:4,color:'CDDEDE'},right:{style:BorderStyle.SINGLE,size:4,color:'CDDEDE'}};
  const cell=(ps,o={})=>new TableCell({children:ps,shading:o.fill?{type:ShadingType.CLEAR,color:'auto',fill:o.fill}:undefined,margins:{top:50,bottom:50,left:90,right:90},borders:o.nb?NB:GB,width:o.w?{size:o.w,type:WidthType.PERCENTAGE}:undefined});
  const txtCell=(t,o={})=>cell(String(t??'').split('\n').map(l=>P(T(l,{size:o.size||17,bold:o.bold,color:o.color}),{after:0})),o);
  const kvT=(it)=>{const rows=[];for(let i=0;i<it.length;i+=3){const cs=[];for(let j=0;j<3;j++){const x=it[i+j];cs.push(cell(x?[P(T(String(x[0]).toUpperCase(),{size:14,color:'6E878C'}),{after:0}),P(T(x[1],{size:19,bold:true}),{after:0})]:[P(T(''))],{nb:true,w:33}))}rows.push(new TableRow({children:cs}))}return new Table({rows,width:{size:100,type:WidthType.PERCENTAGE},borders:{insideHorizontal:{style:BorderStyle.NONE},insideVertical:{style:BorderStyle.NONE}}})};
  const out=[];
  out.push(P(T(p.nome,{size:36,bold:true}),{after:60}));
  out.push(kvT([['Espécie',p.especie],['Raça',p.raca],['Sexo',p.sexo],['Idade',p.idade],['Peso',p.peso?num(p.peso,2)+' kg':''],['Microchip',p.microchip],['Tutor',p.tutor],['CPF',p.cpf],['Telefone',p.telefone],['Endereço',[p.endereco,[p.cidadeTutor,p.ufTutor].filter(Boolean).join('/')].filter(Boolean).join(' · ')]].filter(x=>x[1])));
  let pend=[];const flush=()=>{if(!pend.length)return;const rows=[];for(let i=0;i<pend.length;i+=2){rows.push(new TableRow({children:[0,1].map(j=>{const x=pend[i+j];return cell(x?[P(x.img,{after:40,al:AlignmentType.CENTER}),...(x.cap?[P(T(x.cap,{size:16,it:true,color:'4A656D'}),{after:0})]:[])]:[P(T(''))],{nb:true,w:50})})}))}out.push(new Table({rows,width:{size:100,type:WidthType.PERCENTAGE}}));pend=[]};
  for(const b of WB){if(b.k!=='img'&&b.k!=='cap')flush();
    if(b.k==='h2')out.push(P(T(b.t,{size:28,bold:true,color:'077369'}),{h:HeadingLevel.HEADING_1,before:280,after:100,keep:true}));
    else if(b.k==='h3')out.push(P(T(b.t,{size:22,bold:true}),{h:HeadingLevel.HEADING_2,before:160,after:60,keep:true}));

function splitIdent(t){const ls=String(t||'').split('\n');if((ls[0]||'').trim()==='IDENTIFICAÇÃO'){let j=1;while(j<ls.length&&ls[j].trim()!==''&&/^(Paciente|Tutor\(a\)|Endereço|Telefone|Data do documento|RG|E-mail)/.test(ls[j].trim()))j++;return{ident:ls.slice(1,j),body:ls.slice(ls[j]?.trim()===''?j+1:j).join('\n')}}return{ident:null,body:String(t||'')}}
function docHTML2(t){const sp=splitIdent(t);return(sp.ident?`<div class="doc-id"><b>Identificação</b>${sp.ident.map(l=>`<div>${esc(l)}</div>`).join('')}</div>`:'')+docHTML(sp.body)}
function drawDocHeader(doc,K,title,ident){const{lg,cl,L,PW,M}=K;const lw=drawLogo(doc,lg,M,5,11);const x0=M+(lw?lw+3:0);
  doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(7,115,105);doc.text(L((cl.razao||cl.nome||'').toUpperCase()),x0,9.5);
  doc.setFont('helvetica','normal');doc.setFontSize(7.3);doc.setTextColor(110,135,140);doc.text(L([cl.cnpj&&'CNPJ '+cl.cnpj,cl.endereco,[cl.cidade,cl.estado].filter(Boolean).join('/'),cl.telefone].filter(Boolean).join('  ·  ')),x0,14);
  doc.setDrawColor(10,143,132);doc.setLineWidth(.6);doc.line(M,18,PW-M,18);
  doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(20,48,58);const tl=doc.splitTextToSize(L(title||''),PW-2*M);doc.text(tl,M,26);let y=26+(tl.length-1)*5.6+4;
  if(ident&&ident.length){doc.setFontSize(8);const rows=ident.flatMap(l=>doc.splitTextToSize(L(l),PW-2*M-8));const h=rows.length*3.9+4.5;doc.setFillColor(243,248,248);doc.setDrawColor(213,227,227);doc.setLineWidth(.2);doc.roundedRect(M,y,PW-2*M,h,1.6,1.6,'FD');
    rows.forEach((r,i)=>{const k=r.indexOf(':');doc.setTextColor(20,48,58);if(k>0&&k<28){doc.setFont('helvetica','bold');doc.text(r.slice(0,k+1),M+4,y+4.6+i*3.9);const w=doc.getTextWidth(r.slice(0,k+1));doc.setFont('helvetica','normal');doc.text(r.slice(k+1),M+4+w,y+4.6+i*3.9)}else{doc.setFont('helvetica','normal');doc.text(r,M+4,y+4.6+i*3.9)}});y+=h+6}
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(20,48,58);return y}
function docFooters(doc,K,RNG,extra){const{L,PW,M}=K;const n=doc.getNumberOfPages();
  for(let i=1;i<=n;i++){doc.setPage(i);const ri=RNG.reduce((a,r,j)=>r.s<=i?j:a,0);const r=RNG[ri]||{t:'',s:1};const end=(RNG[ri+1]?.s||n+1)-1;
    doc.setDrawColor(213,227,227);doc.setLineWidth(.2);doc.line(M,284,PW-M,284);doc.setFontSize(7.6);doc.setFont('helvetica','bold');doc.setTextColor(7,115,105);
    const t=doc.splitTextToSize(L(r.t),95)[0];doc.text(t,M,288.5);doc.setFont('helvetica','normal');doc.setTextColor(110,135,140);
    doc.text(L(`Página ${i-r.s+1} de ${end-r.s+1}`),PW/2+20,288.5,{align:'center'});doc.text(L([extra,`folha ${i}/${n}`].filter(Boolean).join(' · ')),PW-M,288.5,{align:'right'});doc.setFontSize(6.8);doc.text(L('Gerado em '+fmtDT(nowDT())),M,292)}}

/* ===== Ficha anestésica padrão: grade 5 min × 10, um símbolo por parâmetro */
const FICHA_P=[
 {k:'fc',l:'FC (bpm)',c:'#13303A',m:'dot'},{k:'fr',l:'FR (mpm)',c:'#2C67DB',m:'ring'},
 {k:'pas',l:'PAS (mmHg)',c:'#C9304A',m:'v'},{k:'pad',l:'PAD (mmHg)',c:'#C9304A',m:'^'},{k:'pam',l:'PAM (mmHg)',c:'#8F1D31',m:'x'},
 {k:'spo2',l:'SpO₂ (%)',c:'#0A8F84',m:'sq'},{k:'etco2',l:'EtCO₂ (mmHg)',c:'#B46F06',m:'osq'},{k:'temp',l:'Temperatura (°C)',c:'#7A4FD0',m:'T'}];
function fichaSym(m,x,y,c,r=5){switch(m){
 case'dot':return`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
 case'ring':return`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="${c}" stroke-width="2"/>`;
 case'v':return`<path d="M${x-r} ${y-r}L${x} ${y+r}L${x+r} ${y-r}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
 case'^':return`<path d="M${x-r} ${y+r}L${x} ${y-r}L${x+r} ${y+r}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
 case'x':return`<path d="M${x-r} ${y-r}L${x+r} ${y+r}M${x+r} ${y-r}L${x-r} ${y+r}" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/>`;
 case'sq':return`<rect x="${x-r+.5}" y="${y-r+.5}" width="${2*r-1}" height="${2*r-1}" fill="${c}"/>`;
 case'T':return`<rect x="${x-r*1.25}" y="${y-r*1.1}" width="${r*2.5}" height="${r*2.2}" rx="2" fill="#fff" stroke="${c}" stroke-width="1"/><text x="${x}" y="${y+r*.68}" text-anchor="middle" font-size="${r*1.9}" font-weight="800" fill="${c}" font-family="Arial,sans-serif">T°</text>`;
 case'osq':return`<rect x="${x-r+1}" y="${y-r+1}" width="${2*r-2}" height="${2*r-2}" fill="#fff" stroke="${c}" stroke-width="2"/>`}return''}
function anFichaSVG(mon){const rows=(mon||[]).filter(r=>r.hora).map(r=>({...r,t:toMin(r.hora)}));
  const t0=rows.length?rows[0].t:0;rows.forEach(r=>r.x=(r.t-t0+1440)%1440);rows.sort((a,b)=>a.x-b.x);
  const last=rows.length?rows[rows.length-1].x:0;const XM=Math.max(135,Math.ceil((last+5)/5)*5);const YM=220;
  const L=46,R=14,T=28,cw=Math.max(14,Math.min(26,780/(XM/5+1))),ncol=XM/5+1,W=L+ncol*cw+R,ch=15,ih=(YM/10)*ch,STR=46,H=T+ih+STR+88;
  const X=x=>L+(x/5)*cw+cw/2,Y=v=>T+ih-(Math.min(Math.max(v,0),YM)/YM)*ih;
  let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="#fff"/>`;
  for(let i=0;i<ncol;i++)for(let j=0;j<YM/10;j++)g+=`<rect x="${L+i*cw}" y="${T+j*ch}" width="${cw}" height="${ch}" fill="${(i+j)%2?'#F3F6F6':'#DCE3E3'}"/>`;
  for(let i=0;i<ncol;i++)g+=`<text x="${L+i*cw+cw/2}" y="${T-9}" text-anchor="middle" font-size="10.5" fill="#4A656D" font-family="Figtree,Arial,sans-serif">${i*5}</text>`;
  for(let v=0;v<YM;v+=10)g+=`<text x="${L-8}" y="${Y(v)+3.5}" text-anchor="end" font-size="10.5" fill="#4A656D" font-family="Figtree,Arial,sans-serif">${v}</text>`;
  g+=`<text x="${L-8}" y="${T-9}" text-anchor="end" font-size="9.5" fill="#7B9197" font-family="Figtree,Arial,sans-serif">min</text>`;
  for(const p of FICHA_P){const pts=rows.map(r=>({x:r.x,v:nv(r[p.k])})).filter(q=>q.v!=null);if(!pts.length)continue;
    if(pts.length>1)g+=`<polyline points="${pts.map(q=>X(q.x)+','+Y(q.v)).join(' ')}" fill="none" stroke="${p.c}" stroke-width="1.2" stroke-opacity=".35"/>`;
    for(const q of pts){g+=fichaSym(p.m,X(q.x),Y(q.v),p.c);if(q.v>YM)g+=`<text x="${X(q.x)}" y="${T-1}" text-anchor="middle" font-size="9" fill="${p.c}">${num(q.v,0)}</text>`}}
  const sy=T+ih+6;const strip=[['Hora',r=>r.hora],['T °C',r=>r.temp],['Vap. %',r=>r.vap]];
  strip.forEach(([lb,f],k)=>{const yy=sy+k*14;g+=`<rect x="${L}" y="${yy}" width="${ncol*cw}" height="13" fill="${k%2?'#fff':'#F5F9F9'}" stroke="#E6EFEF"/><text x="${L-8}" y="${yy+9.5}" text-anchor="end" font-size="9.5" font-weight="700" fill="#4A656D" font-family="Figtree,Arial,sans-serif">${lb}</text>`;
    for(const r of rows){const v=f(r);if(v!=null&&v!=='')g+=`<text x="${X(r.x)}" y="${yy+9.5}" text-anchor="middle" font-size="${lb==='Hora'?8:9}" fill="${lb==='T °C'&&tempLvl(v)?'#B46F06':'#13303A'}" font-family="Figtree,Arial,sans-serif">${esc(String(v))}</text>`}});
  let ly=sy+3*14+18;let lx=L;
  for(const p of FICHA_P){g+=fichaSym(p.m,lx+6,ly,p.c,4.5)+`<text x="${lx+16}" y="${ly+4}" font-size="11" fill="#13303A" font-family="Figtree,Arial,sans-serif">${p.l}</text>`;lx+=p.l.length*6.2+34;if(lx>W-150){lx=L;ly+=18}}
  return`<svg class="ficha-an" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ficha anestésica: parâmetros ao longo do tempo">${g}</svg>`}
function anChartsHTML(mon){const has=(mon||[]).some(r=>r.hora);
  return`<div class="ficha-wrap">${anFichaSVG(mon)}</div>${has?'':'<div class="muted small">Inclua os registros com horário na tabela abaixo: cada parâmetro aparece no gráfico com o seu símbolo, a partir do minuto 0 (primeiro registro).</div>'}
   ${has?`<details class="evo-mais"><summary>Ver gráficos separados por grupo</summary>${chartsSVG(mon)}</details>`:''}`}
async function fichaPNG(mon){if(!(mon||[]).some(r=>r.hora))return null;const svg=anFichaSVG(mon);const m=svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/);const w=+m[1],h=+m[2];
  try{const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await img.decode();const sc=2.2;const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return{url:c.toDataURL('image/png'),w,h}}catch(e){return null}}

const FIN_COLS=['cirurgias','anestesias'];

async function finGuard(r,d){const col=String(r.path).split('/')[0];if(!FIN_COLS.includes(col))return;let x=null;try{const g=await r.get();x=g.exists?g.data():null}catch(_){}
  if(x?.finalizada&&!(S.master&&d&&d.finalizada===false))throw{code:'ficha_finalizada'}}

  return{...d,criadoUid:x?(x.criadoUid??null):(d.criadoUid||S.uid||null)}}
function finBanner(r,k){if(!r?.finalizada)return'';return`<div class="banner ok fin-ban">${ic('check')}<div><b>Ficha finalizada</b> por ${esc(equipeNome(r.finalizadaPor)||'—')} em ${fmtDT(r.finalizadaEm)}. Ninguém pode mais alterar.${S.master?'':' Só o master pode reabrir.'}</div>${S.master?`<span class="spacer"></span><button type="button" class="btn sm" data-act="finReabrir" data-k="${k}" data-allow>Reabrir para edição</button>`:''}</div>`}

function planoRev(pt){if(!pt.alta&&!pt.dias&&!(pt.exames||[]).length&&!pt.planoObs&&!(pt.alertas||[]).length)return'';const p=curP();const ja=new Set(S.solic.filter(x=>x.internacaoId===p.id&&x.status!=='Cancelado').map(x=>norm(x.item)));

function planoCard(p){const ps=(p.planos||[]);if(!ps.length)return'';const dEnt=String(p.entrada||'').slice(0,10);const dia=dEnt?Math.max(1,Math.round((parseD(S.day)-parseD(dEnt))/864e5)+1):null;

const IA_TIPOS={prot:'protocolos',med:'medicamentos',modelos:'descrições cirúrgicas'};
function iaPrompt(k){const meds=(S.meds||[]).map(m=>`- ${m.nome}${m.conc?` | ${String(m.conc).replace('.',',')} ${m.concUn||'mg/mL'}`:''}${m.doseUn?` | dose em ${m.doseUn}`:''}`).join('\n');
  const base=`Você é um assistente que converte textos de uma clínica veterinária (VetPlus) para o formato do sistema de prontuário de internação. Responda SOMENTE com JSON válido, sem comentários e sem texto antes ou depois. Escreva em português do Brasil.
REGRAS GERAIS:
- Nunca invente dose, concentração, frequência ou exame que não esteja no texto. Se faltar, use null e explique no campo "revisar".
- Mantenha nomes comerciais como foram escritos (ex.: Agemoxi®, Cerenia®).
- Números com ponto decimal no JSON (0.05, não "0,05").`;
  if(k==='med')return base+`
FORMATO (lista de medicamentos):
{"medicamentos":[{"nome":"Nome comercial ou princípio ativo e concentração","conc":número ou null,"concUn":"mg/mL"|"mcg/mL"|"UI/mL"|"mEq/mL","dose":número ou null,"doseGato":número ou null,"doseUn":"mg/kg"|"mcg/kg"|"mL/kg"|"UI/kg"|"mEq/kg"|"mg"|"mL","via":"IV"|"IV lenta"|"IM"|"SC"|"VO"|"Tópica"|"Retal","apresentacao":"frasco, ampola, comprimido…","ref":"faixa de dose e frequência de referência em texto","extra":true se não estiver incluso no pacote/diária (cobrado à parte), senão false,"revisar":"o que faltou ou está duvidoso"}]}`;
  if(k==='modelos')return base+`
FORMATO (descrições de procedimento cirúrgico, para o banco de textos da ficha cirúrgica):
{"descricoes":[{"nome":"Nome do procedimento (espécie, se for específico)","categoria":"Reprodutor"|"Tecidos moles"|"Oncologia"|"Odontologia"|"Ortopedia"|"Urinário"|"Digestório"|"Outro","texto":"Descrição em parágrafos, separados por linha em branco: posicionamento e antissepsia; acesso; técnica; síntese por planos; fecho 'Procedimento sem intercorrências.' Use [colchetes] para o que muda em cada caso, ex.: [fio/nº], [padrão]."}]}`;
  return base+`
MEDICAMENTOS JÁ CADASTRADOS (use exatamente estes nomes quando o texto citar o medicamento; a concentração já vem do cadastro):
${meds}
FORMATO (um ou mais protocolos de prescrição):
{"protocolos":[{"nome":"Nome do protocolo","descricao":"Quando usar","especie":"Cão"|"Gato"|null,
 "alta":"critério de alta (padrão da clínica: pelo menos 24 h sem sintomas)","dias":"tempo médio de internação","exames":["exames SUGERIDOS, nunca diários"],"alertas":["avisos para a equipe que NÃO são lançados no mapa, ex.: roupinha cirúrgica, colar elizabetano, isolamento, não usar morfina"],"planoObs":"observações",
 "itens":[{"tipo":"med","nome":"nome igual ao cadastro","dose":número ou null,"doseUn":"mL/kg"|"mg/kg"|"mcg/kg"|"mg"|"mL","doseD1":dose diferente só no 1º dia ou null,"via":"SC"|"IV"|"IV lenta"|"IM"|"VO"|"Retal","freq":"fixo"|"sn"|"unica","horarios":["08:00","16:00","23:50"],"grupo":"nome do grupo quando forem alternativas (só 1 é escolhida), ex.: Antibiótico; senão null","suspenso":true se for 2ª escolha/opcional/se necessário, false se for padrão,"obs":"faixa de dose, condições"},
  {"tipo":"proc","nome":"procedimento de enfermagem","freq":"fixo"|"sn","horarios":["08:00","15:00","22:00"],"obs":""},
  {"tipo":"alim","nome":"alimento","alimento":"Ração úmida / patê"|"Ração seca"|"Ração triturada (pastosa)"|"Alimento líquido: Vetlife"|"Alimento líquido: Salute"|"Água (hidratação enteral)"|"Outro","via":"Oferta voluntária"|"Na seringa"|"Sonda esofágica","freq":"8","obs":""},
  {"tipo":"fluido","soro":"Ringer com lactato"|"NaCl 0,9% (soro fisiológico)","taxaKgH":número em mL/kg/h,"via":"IV","ate":"24h","obs":""}],
 "revisar":"pontos para o veterinário conferir"}]}
REGRAS DA CLÍNICA PARA PROTOCOLOS:
- Aferição de parâmetros + escala de dor: um único item "proc", 3x ao dia (08:00, 15:00, 22:00) ou 4x (08:00, 13:00, 18:00, 22:00). Nada de 2/2 h ou 4/4 h.
- Não colocar exames diários/seriados como item: exames vão em "exames" como sugestão.
- Roupinha cirúrgica, colar elizabetano e isolamento são "alertas", nunca itens.
- Analgesia: tramadol é a 1ª escolha; metadona é a 2ª (mesmo grupo, suspenso true).
- Horários padrão: SID 08:00 · BID 08:00 e 20:00 · TID 08:00, 16:00 e 23:50.
- Itens "se necessário": freq "sn" e sem horários.`}
function iaParse(t){const m=String(t||'').replace(/```json|```/g,'').trim();const i=m.indexOf('{'),j=m.lastIndexOf('}');if(i<0||j<i)throw new Error('sem JSON');return JSON.parse(m.slice(i,j+1))}
function iaNorm(k,o){const L=k==='med'?(o.medicamentos||o.itens||[]):k==='modelos'?(o.descricoes||o.modelos||[]):(o.protocolos||[]);

  return L.map(p=>`<div class="prep-doc"><div class="row"><b style="flex:1">${esc(p.nome)}</b>${p.especie?`<span class="chip">${esc(p.especie)}</span>`:''}<span class="chip warn">rascunho</span></div>

   ${(p.alertas||[]).length?`<div class="small"><b>Alertas:</b> ${p.alertas.map(esc).join(' · ')}</div>`:''}${(p.exames||[]).length?`<div class="small"><b>Exames sugeridos:</b> ${p.exames.map(esc).join(' · ')}</div>`:''}${p.revisar?`<div class="banner warn small">${esc(p.revisar)}</div>`:''}</div>`).join('')}

function route(){
  const h=(location.hash||'#internados').slice(1);$('#side').classList.remove('open');
  if(S.dirty){S.dirty=false}
  if(h.startsWith('p-')){const id=h.slice(2);if(S.pid!==id){S.pid=id;S.day=today();S.cirSel=null;subPaciente(id);S.anSel=null;S.tfSel=null;if(!['admissao','docs','prescricao','mapa','evolucao','comunicacao','semi','anestesia','cirurgia','transfusao','solic','alta','linha'].includes(S.tab))S.tab='prescricao'}S.view='paciente'}
  else if(h.startsWith('cad-')){S.view='cad';S.cadTab=h.slice(4)||'med'}
  else if(h.startsWith('prot-')){S.view='prot';S.protId=h.slice(5)}
  else if(['internados','mapa','historico','boxes','plantao','agenda'].includes(h))S.view=h;
  else S.view='internados';
  if(S.view!=='paciente'&&S.pid){S.pid=null;S.unsubP.forEach(u=>u());S.unsubP=[]}
  render(true);window.scrollTo(0,0);
}

  S._rawdb=db;
  const wrapRef=r=>({id:r.id,path:r.path,get:()=>r.get(),
   set:async(d,o)=>{if(!S.master&&isMCol(r.path))throw{code:'cad_master'};await blkGuard(r.path,d);await finGuard(r,d);d=await authStamp(r,d);return o?r.set(d,o):r.set(d)},
   update:async d=>{if(!S.master&&isMCol(r.path))throw{code:'cad_master'};await blkGuard(r.path,d);await finGuard(r,d);if(!S.master&&d&&'criadoUid' in d){d={...d};delete d.criadoUid}return r.update(d)},
   delete:async()=>{if(S.master)return r.delete();if(isMCol(r.path))throw{code:'cad_master'};try{const g=await r.get();const x=g.exists?g.data():null;if(x&&x.criadoUid&&x.criadoUid===S.uid&&!x.finalizada)return r.delete()}catch(_){}throw{code:'master_only'}},onSnapshot:(a,b)=>r.onSnapshot(a,b),collection:c=>r.collection(c),acquire:o=>r.acquire(o)});
  const wrapCol=(c,p)=>new Proxy(c,{get(t,k){if(k==='doc')return(...a)=>wrapRef(t.doc(...a));if(k==='add')return async d=>{if(!S.master&&isMCol(p))throw{code:'cad_master'};await blkGuard(p+'/_',d);return t.add(d)};const v=t[k];return typeof v==='function'?v.bind(t):v}});
  S.db={doc:p=>wrapRef(db.doc(p)),collection:p=>wrapCol(db.collection(p),p)};
  try{S.uid=user?await user.id():null}catch(e){}
  try{const c=user?await user.can('data.write'):null;if(c===false)S.canWrite=false}catch(e){}
  claude.use('assets').then(a=>{S.assets=a;render()});
  claude.use('downloads').then(d=>{S.downloads=d});
  claude.use('sample').then(x=>{S.sample=x;render()});
  db.collection('intercorrencias').where('data','>=',addDays(today(),-1)).onSnapshot(s=>{S.interRec=docs(s);render()},onErr);
  let loaded=0;const need=6;const mark=()=>{if(++loaded===need){S.ready=true}render()};
  const once=f=>{let first=true;return s=>{f(s);if(first){first=false;mark()}else render()}};
  db.collection('internacoes').onSnapshot(once(s=>{S.intern=docs(s)}),onErr);
  db.collection('medicamentos').onSnapshot(once(s=>{S.meds=docs(s)}),onErr);
  db.collection('procedimentos').onSnapshot(once(s=>{S.procs=docs(s)}),onErr);
  db.collection('equipe').onSnapshot(once(s=>{S.equipe=docs(s)}),onErr);
  db.collection('modelosCirurgicos').onSnapshot(once(s=>{S.modelos=docs(s)}),onErr);
  db.collection('protocolos').onSnapshot(once(s=>{S.prots=docs(s)}),onErr);
  db.collection('assinaturas').onSnapshot(s=>{S.assin=docs(s);render()},onErr);
  db.collection('tutores').onSnapshot(s=>{S.tutores=docs(s);S.tutLoaded=true;tutImport();render()},onErr);
  db.collection('modelosDoc').onSnapshot(s=>{S.modelosDoc=docs(s);importDocs();render()},onErr);
  db.doc('config/clinica').onSnapshot(s=>{S.clinica=s.exists?s.data():null;brandRefresh();if(S.modelosDoc)importDocs();render()},onErr);
  db.collection('boxes').onSnapshot(s=>{S.boxes=docs(s);render()},onErr);
  db.collection('agenda').onSnapshot(s=>{S.agenda=docs(s);render()},onErr);
  db.doc('config/agenda').onSnapshot(s=>{S.agCfg=s.exists?s.data():null;render()},onErr);
  db.collection('solicitacoes').onSnapshot(s=>{S.solic=docs(s);render()},onErr);
  db.collection('escalaImgs').onSnapshot(s=>{S.escImgs={};for(const d of s.docs)S.escImgs[d.id]=d.data();render()},onErr);
  db.collection('plantao').where('data','>=',addDays(today(),-2)).onSnapshot(s=>{S.notas=docs(s);render()},onErr);
  const t=today();
  db.collection('prescricoes').where('data','==',t).onSnapshot(s=>{S.prescHoje={};for(const d of s.docs){const x=d.data();S.prescHoje[x.internacaoId]={id:d.id,...x}}render()},onErr);
  db.collection('evolucoes').where('data','==',t).onSnapshot(s=>{S.evoHoje={};for(const x of docs(s))(S.evoHoje[x.internacaoId]=S.evoHoje[x.internacaoId]||[]).push(x);render()},onErr);
  db.collection('execucoes').where('data','==',t).onSnapshot(s=>{S.execHoje={};for(const d of s.docs){const x=d.data();S.execHoje[x.internacaoId]=x.marks||{}}render()},onErr);
  route();
  setTimeout(()=>{if(!S.ready){S.ready=true;render()}},8000);
}
setInterval(()=>{if(!S.dirty&&!$('#modalRoot').innerHTML&&S.ready)render()},60000);
boot();
</script>
