<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A8F84">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VetPlus">
<script src="lib/firebase-app-compat.js?v=202611112350"></script>
<script src="lib/firebase-auth-compat.js?v=202611112350"></script>
<script src="lib/firebase-firestore-compat.js?v=202611112350"></script>
<script src="fb.js?v=202611112350"></script>
<title>Internação VetPlus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: sidebar fixa (VetSmart) + área de trabalho com abas e cards (SuriVet) + busca rápida (SimplesVet) */
:root{
  --bg:#EDF3F3; --surface:#FFFFFF; --surface-2:#F5F9F9; --sunk:#E4EEEE;
  --ink:#13303A; --ink-2:#4A656D; --ink-3:#7B9197; --line:#D5E3E3; --line-2:#E6EFEF;
  --brand:#0A8F84; --brand-hover:#087A71; --brand-ink:#FFFFFF; --brand-soft:#DAF1EE; --brand-text:#077369;
  --info:#2C67DB; --info-soft:#E2EBFC;
  --ok:#1B8F4E; --ok-soft:#D9F1E3; --warn:#B46F06; --warn-soft:#FBEED3; --crit:#C9304A; --crit-soft:#FAE0E4;
  --shadow:0 1px 2px rgba(19,48,58,.05),0 6px 20px rgba(19,48,58,.06);
  --overlay:rgba(12,30,36,.42);
  --f-display:"Manrope","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1A1D; --surface:#12252A; --surface-2:#163036; --sunk:#0F2125;
  --ink:#E3EFEF; --ink-2:#A5BDC0; --ink-3:#7A9599; --line:#24414A; --line-2:#1C363D;
  --brand:#2BB9AA; --brand-hover:#3CCABB; --brand-ink:#04211E; --brand-soft:#123F3B; --brand-text:#5ED6C8;
  --info:#6E9BF5; --info-soft:#1A2D52;
  --ok:#47C27C; --ok-soft:#133A26; --warn:#E3A33A; --warn-soft:#3E2E10; --crit:#F0697F; --crit-soft:#461C25;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1A1D; --surface:#12252A; --surface-2:#163036; --sunk:#0F2125;
  --ink:#E3EFEF; --ink-2:#A5BDC0; --ink-3:#7A9599; --line:#24414A; --line-2:#1C363D;
  --brand:#2BB9AA; --brand-hover:#3CCABB; --brand-ink:#04211E; --brand-soft:#123F3B; --brand-text:#5ED6C8;
  --info:#6E9BF5; --info-soft:#1A2D52;
  --ok:#47C27C; --ok-soft:#133A26; --warn:#E3A33A; --warn-soft:#3E2E10; --crit:#F0697F; --crit-soft:#461C25;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --overlay:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tnum{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding-block:18px;padding-inline:14px;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.brand-mark svg{width:22px;height:22px;stroke-width:2}
.brand b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.1}
.brand small{color:var(--ink-3);font-size:12px}
.clinic{background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px}
.clinic span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-text);font-weight:700}
.clinic b{display:block;font-size:14px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-h{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);color:var(--ink-2);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand-text);font-weight:600}
.nav a .cnt{margin-left:auto;font-size:12px;background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:0 7px;font-weight:700}
.side-foot{margin-top:auto;font-size:12px;color:var(--ink-3);padding:0 8px}

.topbar{display:none}
.main{min-width:0;padding-block:22px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.crumb{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-text);font-weight:700;display:flex;gap:6px;align-items:center}
.crumb span{color:var(--ink-3);text-transform:none;letter-spacing:0;font-weight:500}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.page-h h1{font-size:26px}
.sub{color:var(--ink-2)}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 13px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:14px}
.btn:hover{border-color:var(--ink-3)}
a.btn{text-decoration:none;color:inherit}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{background:var(--brand-hover)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.icon{padding:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 10px;font-size:14px;font-weight:400;color:var(--ink)}
textarea.inp{resize:vertical;min-height:70px;line-height:1.5}
.inp:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.search{position:relative;flex:1;min-width:200px;max-width:380px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{padding-left:38px;border-radius:30px;height:40px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}.spanall{grid-column:1/-1}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-h h2{font-size:16px}
.panel-b{padding:16px}
.sec-t{font-family:var(--f-display);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin:22px 0 10px}
.sec-t:first-child{margin-top:0}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.brand{background:var(--brand-soft);color:var(--brand-text);border-color:transparent}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}

/* Cards internados */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;position:relative;overflow:hidden}
.pcard::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--u,var(--info))}
.pcard:hover{border-color:var(--brand)}
.pcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pcard h3{font-size:17px}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--brand-soft);color:var(--brand-text);flex:none;font-family:var(--f-display)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;font-weight:600;min-width:0}
.bar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:6px}
.next{font-size:12.5px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.next b{color:var(--ink)}

/* Paciente */
.phead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:18px}
.phead .av{width:56px;height:56px;font-size:18px}
.phead h1{font-size:24px}
.pmeta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink-2);margin-top:6px}
.pmeta b{color:var(--ink);font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:2px 2px;padding:6px 10px 0;border-top:1px solid var(--line-2)}
.tabs a{padding:8px 11px;font-weight:600;font-size:13.5px;color:var(--ink-2);text-decoration:none;border-radius:8px;white-space:nowrap;display:flex;gap:6px;align-items:center;margin-bottom:6px}
.tabs a:hover{background:var(--surface-2)}
.tabs a svg{width:16px;height:16px}
.tabs a.on{background:var(--brand-soft)}
.tabs a:hover{color:var(--ink)}
.tabs a.on{color:var(--brand-text)}
.daynav{display:flex;align-items:center;gap:6px}
.daynav .d{font-weight:700;font-family:var(--f-display);min-width:140px;text-align:center}

/* Tabela prescrição */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.susp td{opacity:.5;text-decoration:line-through}
.tbl .nm{font-weight:700}
.typ{width:30px;height:30px;border-radius:8px;display:grid;place-items:center}
.typ.med{background:var(--brand-soft);color:var(--brand-text)}
.typ.proc{background:var(--info-soft);color:var(--info)}
.typ.flu{background:var(--warn-soft);color:var(--warn)}
.hrs{display:flex;flex-wrap:wrap;gap:4px}
.hrs span{font-family:var(--f-mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px}
.vol{font-family:var(--f-mono);font-weight:600;color:var(--brand-text)}

/* Mapa de execução */
.map-wrap{overflow-x:auto;border-top:1px solid var(--line-2)}
table.map{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
.map th,.map td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);padding:0;height:44px;text-align:center}
.map thead th{height:34px;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);font-weight:600;background:var(--surface-2);min-width:46px;position:sticky;top:0}
.map thead th.now{color:var(--brand-ink);background:var(--brand)}
.map td.now{background:color-mix(in srgb,var(--brand-soft) 55%,transparent)}
.map .lbl{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left;padding:6px 12px;min-width:220px;max-width:260px;border-right:1px solid var(--line)}
.map thead .lbl{background:var(--surface-2);z-index:2}
.map .lbl b{display:block;font-size:13px}
.map .lbl small{color:var(--ink-3);font-size:11.5px}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;height:100%;min-height:43px;border:0;background:transparent;cursor:pointer;padding:2px}
.cell:disabled{cursor:default}
.mk{font-family:var(--f-mono);font-size:10.5px;font-weight:600;border-radius:5px;padding:1px 4px;line-height:1.35}
.mk.pend{color:var(--ink-2);border:1px dashed var(--ink-3)}
.mk.late{color:var(--warn);background:var(--warn-soft);border:1px solid var(--warn)}
.mk.ok{color:var(--ok);background:var(--ok-soft)}
.mk.nao{color:var(--crit);background:var(--crit-soft)}
.mk.ini{font-size:9.5px;color:var(--ink-3);font-family:var(--f-body)}
.cell.sn:hover::after{content:"+";color:var(--ink-3);font-weight:700}
.cell:hover{background:var(--surface-2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);align-items:center}

/* Agenda geral */
.agenda{display:flex;flex-direction:column}
.hour{display:grid;grid-template-columns:70px minmax(0,1fr);border-bottom:1px solid var(--line-2)}
.hour:last-child{border-bottom:0}
.hour .h{font-family:var(--f-mono);font-weight:600;padding:12px 14px;color:var(--ink-3)}
.hour.cur .h{color:var(--brand-text)}
.hour .tasks{display:flex;flex-direction:column;gap:6px;padding:8px 12px 8px 0}
.task{display:flex;align-items:center;gap:10px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.task:hover{border-color:var(--brand)}
.task .who{font-weight:700;min-width:90px}
.task .what{flex:1;min-width:0}
.task .what small{color:var(--ink-3)}

/* Formulário admissão */
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.q:last-child{border-bottom:0}
.q .ql{font-weight:600}
.yn{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.yn label{cursor:pointer}
.yn input{position:absolute;opacity:0;pointer-events:none}
.yn span{display:block;padding:6px 14px;font-weight:600;font-size:13px;color:var(--ink-2)}
.yn label+label span{border-left:1px solid var(--line)}
.yn input:checked+span{background:var(--brand);color:var(--brand-ink)}
.yn input.n:checked+span{background:var(--ink-2);color:var(--surface)}
.yn input:focus-visible+span{outline:2px solid var(--brand);outline-offset:-2px}
.q .qt{grid-column:1/-1}
.savebar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-radius:0 0 var(--r) var(--r);z-index:3}
.dirty-dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}

/* Conferência alta */
.conf{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 250px;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line-2)}
.conf:last-child{border-bottom:0}
.conf .from{font-size:13px;background:var(--surface-2);border-radius:var(--r-sm);padding:8px 10px}
.conf .from b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}

/* Timeline */
.tl{display:flex;flex-direction:column}
.tl-d{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.tl-d:last-child{border-bottom:0}
.tl-d .dd{font-family:var(--f-display);font-weight:700}
.tl-d .dd small{display:block;font-family:var(--f-body);font-weight:500;color:var(--ink-3);font-size:12px}

/* Fotos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.photos figure{margin:0;position:relative;aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;background:var(--sunk);max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .rm{position:absolute;top:4px;right:4px;background:var(--surface);border-radius:6px}
.upl{border:1.5px dashed var(--line);border-radius:var(--r-sm);display:grid;place-items:center;aspect-ratio:1;color:var(--ink-3);cursor:pointer;font-size:12.5px;text-align:center;padding:8px;gap:4px}
.upl:hover{border-color:var(--brand);color:var(--brand-text)}

/* Modal */
.ov{position:fixed;inset:0;background:var(--overlay);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-block:max(40px,env(safe-area-inset-top,0px)) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal.wide{max-width:820px}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.modal-h h2{font-size:18px;flex:1}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.calc{background:var(--brand-soft);color:var(--brand-text);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
.calc b{font-family:var(--f-mono);font-size:17px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:600;font-size:13px}
.seg input:checked+span{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text)}
.seg input.bad:checked+span{border-color:var(--crit);background:var(--crit-soft);color:var(--crit)}
.seg input:focus-visible+span{outline:2px solid var(--brand)}

/* Autocomplete */
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow);z-index:5;max-height:280px;overflow:auto;padding:4px}
.ac-list button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer}
.ac-list button.act,.ac-list button:hover{background:var(--brand-soft)}
.ac-list button .c{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--brand-text);font-weight:600}
.ac-list .ref{font-size:11.5px;color:var(--ink-3)}
.ac-list .new{color:var(--info);font-weight:600}
mark{background:transparent;color:var(--brand-text);font-weight:700}

const $=(s,r=document)=>r.querySelector(s);

const toMin=hm=>{if(!hm)return 0;const[h,m]=hm.split(':').map(Number);return h*60+(m||0)};

/* ---------- Agenda / cálculo ---------- */
function horarios(it){
  if(!it||it.suspenso)return[];
  if(it.tipo==='fluido'){
    const s=toMin(it.inicio||'08:00');let e=it.ate==='24h'||!it.fim?s+1440:toMin(it.fim);if(e<=s)e+=1440;
    const step=Math.max(1,Number(it.conferir)||2)*60;const out=[];for(let t=s;t<e&&out.length<48;t+=step)out.push(toHM(t));
    return [...new Set(out)].sort();
  }
  if(it.freq==='sn'||it.freq==='livre')return[];
  if(it.freq==='fixo')return [...new Set((it.horarios||[]).filter(Boolean))].sort();
  if(it.freq==='unica')return[it.inicio||'08:00'];
  const q=Number(it.freq)||24,s=toMin(it.inicio||'08:00');const out=[];for(let k=0;k*q<24;k++)out.push(toHM(s+k*q*60));
  return [...new Set(out)].sort();
}
function conv(a,b){if(a===b)return 1;if(a==='mcg'&&b==='mg')return .001;if(a==='mg'&&b==='mcg')return 1000;return null}
function calc(dose,du,conc,cu,peso){
  dose=parseFloat(String(dose).replace(',','.'));conc=parseFloat(String(conc||'').replace(',','.'));peso=parseFloat(String(peso||'').replace(',','.'));
  if(!dose||!du)return null;
  if(du==='mL/kg'||du==='mL'){
    if(du==='mL/kg'&&!peso)return null;
    const ml=du==='mL'?dose:dose*peso;
    return conc&&cu?{ml,total:ml*conc,un:cu.split('/')[0]}:{ml};
  }
  const perKg=du.endsWith('/kg'),base=perKg?du.slice(0,-3):du;
  if(perKg&&!peso)return null;
  const total=perKg?dose*peso:dose;
  if(!conc||!cu)return{total,un:base};
  const f=conv(base,cu.split('/')[0]);if(f==null)return{total,un:base};
  return{total,un:base,ml:total*f/conc};
}
function marksFor(pid,day){return day===today()&&S.view!=='paciente'?(S.execHoje[pid]||{}):(pid===S.pid?(S.pExec[day]||{}):(day===today()?S.execHoje[pid]||{}:{}))}
function prescFor(pid,day){if(pid===S.pid&&S.pPresc[day])return S.pPresc[day];if(day===today())return S.prescHoje[pid];return null}
function status(day,hm,mark){
  if(mark&&mark.s)return mark.s;
  const t=today();if(day<t)return'late';if(day>t)return'pend';
  return toMin(hm)<=toMin(nowHM())-15?'late':'pend';
}
function progresso(pid,day){
  const pr=prescFor(pid,day);if(!pr)return null;const mk=(pid===S.pid?S.pExec[day]:null)||S.execHoje[pid]||{};
  let tot=0,ok=0,late=0,next=null;
  for(const it of pr.itens||[]){for(const h of horarios(it)){tot++;const m=mk[it.id+'|'+h];const st=status(day,h,m);if(st==='ok'||st==='nao')ok++;else if(st==='late')late++;else if(!next||toMin(h)<toMin(next.h))next={h,it}}}
  return{tot,ok,late,next};
}
function itemLine(it){
  if(it.tipo==='fluido')return`${esc(it.soro)} · ${it.taxaKgH?num(it.taxaKgH,2)+' mL/kg/h = ':''}${num(it.taxa,1)} mL/h · ${esc(it.via||'IV')}`;
  if(it.tipo==='alim')return`${it.qtd!=null?num(it.qtd)+' '+esc(it.qtdUn):esc(it.qtdUn||'')} · ${esc(it.via||'')}${it.tempo?' · '+esc(it.tempo)+' min':''}`;
  if(it.tipo==='proc')return esc(it.obs||'Procedimento');
  const v=it.volume!=null?` → <span class="vol">${num(it.volume)} mL</span>`:'';
  return`${num(it.dose,3)} ${esc(it.doseUn)}${v} · ${esc(it.via)}`;
}

/* Cadastros */
function viewCad(){
  const t=S.cadTab;const tabs=[['tutores','Tutores'],['med','Medicamentos'],['proc','Procedimentos'],['prot','Protocolos'],['equipe','Equipe'],['modelos','Descrições cirúrgicas'],['boxes','Boxes'],['escalas','Escalas de dor'],['descritivos','Outros descritivos'],['docs','Documentos'],['clinica','Clínica']];
  let body='';
  if(t==='med'){const l=[...S.meds].sort((a,b)=>a.nome.localeCompare(b.nome));
    body=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Medicamento</th><th>Concentração</th><th>Via padrão</th><th>Dose padrão</th><th>Posologia / referência</th><th></th></tr></thead><tbody>${l.map(m=>`<tr><td class="nm">${esc(m.nome)}${m.extra?' <span class="chip aut" title="Não incluso no pacote/diária: aplicar só com autorização prévia do tutor">$ fora do pacote</span>':''}<div class="muted small">${esc(m.apresentacao||'')}</div></td><td class="mono">${m.conc!=null?num(m.conc,3)+' '+esc(m.concUn):'<span class="chip warn">conferir</span>'}</td><td>${esc(m.via||'—')}</td><td class="small tnum" style="white-space:nowrap">${m.dose!=null?`Cão ${num(m.dose,3)} ${esc(m.doseUn||'')}`:'—'}${m.doseGato!=null?`<br>Gato ${num(m.doseGato,3)} ${esc(m.doseUn||'')}`:''}</td><td class="small">${esc(m.ref||'—')}</td><td style="text-align:right;white-space:nowrap"><button class="btn sm ghost" data-act="cadEdit" data-k="med" data-id="${m.id}" ${W()}>${ic('edit')}</button><button class="btn sm ghost danger" data-act="cadDel" data-k="med" data-id="${m.id}" ${W()}>${ic('trash')}</button></td></tr>`).join('')||'<tr><td colspan="6" class="muted">Nenhum medicamento cadastrado.</td></tr>'}</tbody></table></div>`}
  if(t==='proc'){const l=[...S.procs].sort((a,b)=>a.nome.localeCompare(b.nome));
    body=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Procedimento</th><th>Frequência padrão</th><th>Instruções</th><th></th></tr></thead><tbody>${l.map(m=>`<tr><td class="nm">${esc(m.nome)}</td><td>${freqLbl(m.freq||'24')}</td><td class="small">${esc(m.instrucoes||'—')}</td><td style="text-align:right;white-space:nowrap"><button class="btn sm ghost" data-act="cadEdit" data-k="proc" data-id="${m.id}" ${W()}>${ic('edit')}</button><button class="btn sm ghost danger" data-act="cadDel" data-k="proc" data-id="${m.id}" ${W()}>${ic('trash')}</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Nenhum procedimento cadastrado.</td></tr>'}</tbody></table></div>`}
  if(t==='equipe'){const l=[...S.equipe].sort((a,b)=>a.nome.localeCompare(b.nome));
    body=l.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Nome</th><th>Função</th><th>CRMV / registro</th><th>Situação</th><th></th></tr></thead><tbody>${l.map(m=>`<tr><td class="nm"><div class="row"><span class="av" style="width:30px;height:30px;font-size:11px">${initials(m.nome)}</span>${esc(m.nome)}</div></td><td>${esc(m.funcao||'—')}</td><td class="mono">${esc(m.registro||'—')}</td><td>${m.ativo===false?'<span class="chip">Inativo</span>':'<span class="chip ok">Ativo</span>'}</td><td style="text-align:right;white-space:nowrap"><button class="btn sm ghost" data-act="cadEdit" data-k="equipe" data-id="${m.id}" ${W()}>${ic('edit')}</button><button class="btn sm ghost danger" data-act="cadDel" data-k="equipe" data-id="${m.id}" ${W()}>${ic('trash')}</button></td></tr>`).join('')}</tbody></table></div>`
      :emptyBox('users','Cadastre sua equipe','Os nomes cadastrados aqui aparecem como “responsável” em cada medicação aplicada, na admissão, na cirurgia e na alta.')}
  if(t==='prot'){const l=[...S.prots].sort((a,b)=>(protOk(a)-protOk(b))||a.nome.localeCompare(b.nome));
    body=l.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Protocolo</th><th>Itens</th><th>Quando usar</th><th></th></tr></thead><tbody>${l.map(m=>`<tr style="cursor:pointer" data-act="protOpen" data-id="${m.id}"><td class="nm">${esc(m.nome)} ${protOk(m)?'':'<span class="chip warn">Rascunho</span>'}</td><td class="small">${(m.itens||[]).map(i=>esc(i.tipo==='fluido'?'Fluidoterapia':i.nome)).join(', ')||'<span class="muted">vazio</span>'}</td><td class="small">${esc(m.descricao||'—')}</td><td style="text-align:right">${ic('right')}</td></tr>`).join('')}</tbody></table></div>`:emptyBox('clip','Nenhum protocolo','Crie receitas padrão, como a de castração, com dose por kg e horários fixos. Na internação, os volumes saem calculados pelo peso.')}
  if(t==='modelos'){const l=[...S.modelos].sort((a,b)=>String(a.categoria||'zz').localeCompare(String(b.categoria||'zz'))||a.nome.localeCompare(b.nome));
    body=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Procedimento</th><th>Categoria</th><th>Texto</th><th></th></tr></thead><tbody>${l.map(m=>`<tr><td class="nm">${esc(m.nome)}</td><td><span class="chip">${esc(m.categoria||'Outros')}</span></td><td class="small" style="max-width:60ch">${esc(String(m.texto||'').slice(0,180))}${String(m.texto||'').length>180?'…':''}</td><td style="text-align:right;white-space:nowrap"><button class="btn sm ghost" data-act="cadEdit" data-k="modelos" data-id="${m.id}" ${W()}>${ic('edit')}</button><button class="btn sm ghost danger" data-act="cadDel" data-k="modelos" data-id="${m.id}" ${W()}>${ic('trash')}</button></td></tr>`).join('')||'<tr><td colspan="3" class="muted">Nenhum modelo cadastrado.</td></tr>'}</tbody></table></div>`}
  const lbl={tutores:'tutor',med:'medicamento',proc:'procedimento',prot:'protocolo',equipe:'membro da equipe',modelos:'modelo',boxes:'box',escalas:'',descritivos:'',docs:'documento',clinica:''}[t];
  if(t==='docs')body=viewDocsCad();
  if(t==='tutores')body=viewTutores();
  if(t==='clinica')body=viewClinica();
  if(t==='boxes'){const l=[...S.boxes].sort((a,b)=>String(a.setor).localeCompare(String(b.setor))||(a.ordem??99)-(b.ordem??99)||String(a.nome).localeCompare(String(b.nome),'pt',{numeric:true}));body=`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Box</th><th>Setor</th><th>Ordem</th><th>Ocupado por</th><th></th></tr></thead><tbody>${l.map(b=>{const o=ativos().find(p=>String(p.box||'').toLowerCase()===String(b.nome).toLowerCase());return`<tr><td class="nm">${esc(b.nome)}</td><td>${esc(b.setor||'—')}</td><td class="tnum">${esc(b.ordem??'')}</td><td>${o?esc(o.nome):'<span class="muted">Livre</span>'}</td><td style="text-align:right;white-space:nowrap"><button class="btn sm ghost" data-act="cadEdit" data-k="boxes" data-id="${b.id}" ${W()}>${ic('edit')}</button><button class="btn sm ghost danger" data-act="cadDel" data-k="boxes" data-id="${b.id}" ${W()}>${ic('trash')}</button></td></tr>`}).join('')||'<tr><td colspan="5" class="muted">Nenhum box cadastrado.</td></tr>'}</tbody></table></div>`}
  if(t==='escalas')body=viewEscalas();
  if(t==='descritivos')body=viewDescritivos();
  return`<div class="crumb">Cadastros <span>› ${tabs.find(x=>x[0]===t)[1]}</span></div>
   <div class="page-h"><div><h1>${tabs.find(x=>x[0]===t)[1]}</h1><div class="sub">${t==='docs'?'Textos dos seus TCLE, termos e contratos. Use os campos automáticos para puxar dados do paciente e do tutor.':t==='clinica'?'Dados que aparecem nos documentos e o WhatsApp que recebe as confirmações dos tutores.':t==='boxes'?'Boxes da clínica por setor. O mapa de boxes mostra quem está em cada um.':t==='escalas'?'Imagens de referência das escalas de dor usadas na evolução.':t==='prot'?'Receitas padrão aplicadas na internação ou depois, na prescrição do dia.':t==='med'?'Concentrações usadas na clínica. Ao prescrever, a concentração entra sozinha e o volume é calculado pelo peso.':t==='modelos'?'Banco de descrições por procedimento. Na ficha cirúrgica, busque e inclua quantos precisar; dá para atualizar o texto padrão direto da ficha.':''}</div></div>
   ${['med','prot','modelos'].includes(t)?`<span class="row" style="gap:8px"><button class="btn" data-act="iaImport" data-k="${t}" ${W()}>${ic('spark')}Importar com IA</button>`:''}${t==='escalas'||t==='clinica'||t==='descritivos'?'':`<button class="btn pri" data-act="${t==='prot'?'protNew':t==='docs'?'docNew':t==='tutores'?'tutNew':'cadEdit'}" data-k="${t}" ${W()}>${ic('plus')}Novo ${lbl}</button>`}${['med','prot','modelos'].includes(t)?'</span>':''}</div>
   <div class="subtabs">${tabs.map(x=>`<a href="#cad-${x[0]==='med'?'med':x[0]}" class="${x[0]===t?'on':''}">${x[1]}</a>`).join('')}</div>
   <div class="panel">${body}</div>`;
}

/* Paciente */
function viewPaciente(){
  const p=curP();if(!p)return emptyBox('bed','Paciente não encontrado','Ele pode ter sido removido. Volte para a lista de internados.','<a class="btn" href="#internados">Voltar</a>');
  const u=URG[p.urgencia]||URG.nao;
  const tabs=[['admissao','Admissão',ic('clip')],['docs','Documentos',ic('file')],['prescricao','Prescrição',ic('pill')],['mapa','Mapa de execução',ic('grid')],['evolucao','Evolução',ic('thermo')],['comunicacao','Comunicação com o tutor',ic('users')],['semi','Semi-internamento',ic('monitor')],['anestesia','Anestesia',ic('anes')],['cirurgia','Cirurgias',ic('scalp')],['transfusao','Transfusão',ic('drop')],['solic','Exames e serviços',ic('file')],['alta','Saída',ic('door')],['linha','Linha do tempo',ic('hist')]];
  let body='';
  if(S.tab==='admissao')body=tabAdmissao(p);
  else if(S.tab==='prescricao')body=tabPrescricao(p);
  else if(S.tab==='mapa')body=tabMapa(p);
  else if(S.tab==='cirurgia')body=tabCirurgia(p);
  else if(S.tab==='alta')body=tabAlta(p);
  else if(S.tab==='anestesia')body=tabAnestesia(p);
  else if(S.tab==='evolucao')body=tabEvolucao(p);
  else if(S.tab==='semi')body=tabSemi(p);
  else if(S.tab==='comunicacao')body=tabComm(p);
  else if(S.tab==='transfusao')body=tabTransf(p);
  else if(S.tab==='docs')body=tabDocs(p);
  else if(S.tab==='solic')body=tabSolic(p);
  else body=tabLinha(p);
  return`<div class="crumb"><a href="#internados" style="color:inherit;text-decoration:none">Internação</a> <span>› ${esc(p.nome)}</span></div>
  <div class="panel" style="margin:10px 0 16px;border-top:3px solid ${u[2]}">
   <div class="phead">${S.assets?`<label class="avwrap" title="Trocar foto">${avatar(p,'lg')}<span class="avcam">${ic('cam')}</span><input type="file" id="fotoPac" accept="image/*" hidden></label>`:avatar(p,'lg')}
    <div style="flex:1;min-width:220px"><div class="row"><h1>${esc(p.nome)}</h1>${p.exemplo?'<span class="ex-tag">Exemplo</span>':''}<span class="chip ${u[1]}">${u[0]}</span>${p.tipoInt==='Semi-internação'?'<span class="chip info">Semi-internação</span>':''}${blkTag(p)}${p.status==='alta'?(l=>`<span class="chip ${l[1]}">${esc(l[0])}</span>`)(saidaLabel(p)):'<span class="chip brand">Internado</span>'}</div>
     <div class="pmeta"><span>${esc([p.especie,p.raca,p.sexo,p.idade].filter(Boolean).join(' · ')||'—')}</span><span>Peso <b class="tnum">${p.peso?num(p.peso,2)+' kg':'—'}</b></span><span>Tutor <b>${esc(p.tutor||'—')}</b>${p.telefone?` · <span class="mono">${esc(p.telefone)}</span>`:''}</span></div>
     <div class="pmeta"><span>Entrada <b class="tnum">${fmtDT(p.entrada)}</b></span><span>Duração <b class="tnum">${durStr(p.entrada,p.status==='alta'?p.saida:null)}</b></span><span>Alta prevista <b style="color:${p.altaPrevista&&p.altaPrevista<today()&&p.status!=='alta'?'var(--crit)':'inherit'}">${fmtD(p.altaPrevista)}</b></span><span>Box <b>${esc(p.box||'Sem box')}</b></span><span>Microchip <b class="mono">${esc(p.microchip||'—')}</b></span>${p.vet?`<span>Vet. responsável <b>${esc(equipeNome(p.vet))}</b></span>`:''}</div>
     ${p.motivo?`<div class="pmeta"><span>Motivo <b>${esc(p.motivo)}</b></span></div>`:''}
    </div>
    <div class="row"><button class="btn" data-act="comQuick" ${S.canWrite?'':'disabled'}>${ic('users')}Mensagem ao tutor</button><button class="btn" data-act="pdf">${ic('file')}Exportar PDF</button><button class="btn" data-act="editInt" ${S.canWrite?'':'disabled'}>${ic('edit')}Editar dados</button>${p.bloqueio?.ativo?(S.master?`<button class="btn blk-btn" data-act="blkOff">${ic('check')}Liberar (pagamento quitado)</button>`:''):`<button class="btn blk-btn-on" data-act="blkOn" ${S.canWrite?'':'disabled'}>${ic('flag')}Suspender por não pagamento</button>`}</div>
   </div>
   <nav class="tabs">${tabs.map(t=>`<a href="#" data-act="tab" data-t="${t[0]}" class="${S.tab===t[0]?'on':''}">${t[2]}${t[1]}</a>`).join('')}</nav>
  </div>${blkBanner(p)}${defecBanner(p)}${p.status!=='alta'||(p.orientacoes||[]).length?orientBar(p):''}${body}`;
}
function dayNav(p){
  const d=S.day;const min=p.entrada?p.entrada.slice(0,10):null;const max=p.status==='alta'&&p.saida?p.saida.slice(0,10):addDays(today(),1);
  return`<div class="daynav"><button class="btn icon" data-act="day" data-n="-1" ${min&&d<=min?'disabled':''} aria-label="Dia anterior">${ic('left')}</button>
   <div class="d">${wd(d)}, ${fmtD(d)}${d===today()?' <span class="chip brand">hoje</span>':''}</div>
   <button class="btn icon" data-act="day" data-n="1" ${d>=max?'disabled':''} aria-label="Próximo dia">${ic('right')}</button>
   ${d!==today()?'<button class="btn sm ghost" data-act="dayToday">Hoje</button>':''}</div>`;
}

/* Admissão */
function tabAdmissao(p){
  const a=p.admissao||{};const qv=a.q||{};
  const eqOpts=sel=>`<option value="">—</option>`+S.equipe.filter(e=>e.ativo!==false||e.id===sel).map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${esc(e.nome)}</option>`).join('');
  const qs=ADM_Q.map(q=>{const v=qv[q.k]?.v||'';const on=q.on||'sim';return`<div class="q" data-on="${on}"><div class="ql">${q.l}</div>
    <div class="yn" role="radiogroup" aria-label="${esc(q.l)}"><label><input type="radio" name="q_${q.k}" value="sim" ${v==='sim'?'checked':''}><span>Sim</span></label><label><input type="radio" class="n" name="q_${q.k}" value="nao" ${v==='nao'?'checked':''}><span>Não</span></label></div>
    ${q.noText?'':`<textarea class="inp qt" name="t_${q.k}" rows="2" placeholder="${esc(q.ph)}" ${v===on?'':'hidden'}>${esc(qv[q.k]?.t||'')}</textarea>`}</div>`}).join('');
  return`<form class="panel" id="fAdm" data-track onsubmit="return false">
   <div class="panel-h"><h2>Ficha de admissão</h2><span class="spacer"></span>${a.salvoEm?`<span class="muted small">Salva em ${fmtDT(a.salvoEm)}${a.responsavel?' · '+esc(equipeNome(a.responsavel)):''}</span>`:'<span class="chip warn">Ainda não preenchida</span>'}</div>
   <div class="panel-b">
    <div class="sec-t">Avaliação na entrada</div>
    <div class="grid g6">
     <label class="f">Peso (kg)<input class="inp tnum" name="peso" inputmode="decimal" value="${esc(a.peso??p.peso??'')}"></label>
     <label class="f">Temperatura (°C)<input class="inp tnum" name="temp" inputmode="decimal" value="${esc(a.temp||'')}"></label>
     <label class="f">FC (bpm)<input class="inp tnum" name="fc" inputmode="numeric" value="${esc(a.fc||'')}"></label>
     <label class="f">FR (mpm)<input class="inp tnum" name="fr" inputmode="numeric" value="${esc(a.fr||'')}"></label>
     <label class="f">TPC (s)<input class="inp tnum" name="tpc" inputmode="decimal" value="${esc(a.tpc||'')}"></label>
     <label class="f">Dor (0–10)<input class="inp tnum" name="dor" inputmode="numeric" value="${esc(a.dor||'')}"></label>
     <label class="f span2">Mucosas<select class="inp" name="mucosas">${['','Normocoradas','Hipocoradas','Hipercoradas','Ictéricas','Cianóticas','Pálidas'].map(o=>`<option ${a.mucosas===o?'selected':''}>${o}</option>`).join('')}</select></label>
     <label class="f span2">Hidratação<select class="inp" name="hidratacao">${['','Normohidratado','Desidratação leve (5%)','Desidratação moderada (6–8%)','Desidratação grave (>8%)'].map(o=>`<option ${a.hidratacao===o?'selected':''}>${o}</option>`).join('')}</select></label>
     <label class="f span2">Nível de consciência<select class="inp" name="consciencia">${['','Alerta','Deprimido','Estuporoso','Comatoso'].map(o=>`<option ${a.consciencia===o?'selected':''}>${o}</option>`).join('')}</select></label>
     <label class="f spanall">Queixa / motivo da internação<textarea class="inp" name="queixa" rows="2">${esc(a.queixa??p.motivo??'')}</textarea></label>
    </div>
    <div class="sec-t">Questionário com o tutor</div>
    <div>${qs}</div>
    <div class="sec-t">Fechamento</div>
    <div class="grid g3">
     <label class="f">Responsável pela admissão<select class="inp" name="responsavel">${eqOpts(a.responsavel)}</select></label>
     <label class="f">Termo de internação<select class="inp" name="termo">${['Assinado','Pendente','Não se aplica'].map(o=>`<option ${a.termo===o?'selected':''}>${o}</option>`).join('')}</select></label>
     <label class="f">Contato de emergência<input class="inp" name="contato" value="${esc(a.contato||'')}" placeholder="Nome e telefone"></label>
     <label class="f spanall">Observações gerais<textarea class="inp" name="obs" rows="2">${esc(a.obs||'')}</textarea></label>
    </div>
   </div>
   <div class="savebar"><span class="dirty-ind small muted" hidden><span class="dirty-dot"></span> Alterações não salvas</span><span class="spacer"></span><button class="btn ghost" data-act="discard" type="button">Descartar</button><button class="btn pri" data-act="saveAdm" type="button" ${W()}>${ic('check')}Salvar admissão</button></div>
  </form>`;
}

/* Prescrição */
function itemsTable(itens,ctx,peso){
  const rows=itens.map(it=>{
    const hs=horarios(it);const tp=it.tipo==='fluido'?'flu':it.tipo==='proc'?'proc':it.tipo==='alim'?'alim':'med';const tx=it.tipo==='fluido'&&ctx==='prot'&&it.taxaKgH&&peso?it.taxaKgH*peso:it.taxa;
    let r=null;if(it.tipo==='med')r=ctx==='prot'?calc(it.dose,it.doseUn,it.conc,it.concUn,peso):{ml:it.volume,total:it.total,un:it.totalUn};
    let dose='—';
    if(it.tipo==='med')dose=`<span class="tnum">${num(it.dose,3)} ${esc(it.doseUn)}</span>${r&&r.total!=null?`<div class="muted small tnum">= ${num(r.total,2)} ${esc(r.un||'')}</div>`:''}`;
    if(it.tipo==='alim')dose=`<span class="tnum">${it.qtd!=null?num(it.qtd)+' '+esc(it.qtdUn):esc(it.qtdUn||'—')}</span>${it.tempo?`<div class="muted small">disponível ${esc(it.tempo)} min</div>`:''}${it.agua?`<div class="muted small">Água: ${esc(it.agua)}</div>`:''}`;
    if(it.tipo==='fluido')dose=`${it.taxaKgH?`<span class="tnum">${num(it.taxaKgH,2)} mL/kg/h</span><div class="vol">= ${num(tx,1)} mL/h na bomba</div>`:`<span class="tnum">${num(tx,1)} mL/h</span>`}<div class="muted small">${it.manut?'<span class="chip info">Manutenção contínua</span> ':''}${it.ate==='24h'?'24 horas':'até '+esc(it.fim)}${it.aditivos?' · '+esc(it.aditivos):''}</div>`;
    const vol=it.tipo==='med'?(r&&r.ml!=null?`<span class="vol">${num(r.ml)} mL</span>`:'<span class="muted">—</span>'):it.tipo==='fluido'?`<span class="vol">${num(tx*(((it.ate==='24h'||!it.fim)?1440:((toMin(it.fim)-toMin(it.inicio)+1440)%1440||1440))/60),0)} mL</span><div class="muted small">no período</div>`:'—';
    return`<tr class="${it.suspenso?'susp':''}"><td><div class="typ ${tp}">${ic(tp==='flu'?'drop':tp==='proc'?'hand':tp==='alim'?'bowl':'pill')}</div></td>

function CTX(kind){
  if(kind==='prot'){const pt=byId(S.prots,S.protId);return{peso:S.protPeso,itens:()=>pt?.itens||[],save:itens=>S.db.doc('protocolos/'+pt.id).update({itens})}}
  const p=curP();const pr=S.pPresc[S.day];return{peso:pr?.peso??p?.peso,itens:()=>S.pPresc[S.day]?.itens||[],save:itens=>S.db.doc(`prescricoes/${p.id}_${S.day}`).update({itens,editadoEm:nowDT()})};
}
const ORD={fluido:0,med:1,alim:2,proc:3};
const sortItens=a=>[...a].sort((x,y)=>ORD[x.tipo]-ORD[y.tipo]);
function recalc(itens,peso){return itens.map(it=>{if(it.tipo==='fluido'&&it.taxaKgH&&peso)return{...it,taxa:Math.round(it.taxaKgH*peso*10)/10};if(it.tipo!=='med')return it;const r=calc(it.dose,it.doseUn,it.conc,it.concUn,peso);return{...it,total:r?.total??null,totalUn:r?.un||null,volume:r?.ml!=null?Math.round(r.ml*100)/100:null}})}
const protOk=x=>x.status!=='rascunho';
function protGrupos(pt){const g={};for(const it of pt.itens||[])if(it.grupo)(g[it.grupo]=g[it.grupo]||[]).push(it);return g}
function buildProt(pt,especie,escolhas,day,peso){const gato=/gato|felin/i.test(especie||'');
  const lote=rid();return recalc((pt.itens||[]).map(x=>{const it={...JSON.parse(JSON.stringify(x)),id:rid(),protocolo:pt.nome,lote};if(it.grupo&&escolhas&&escolhas[it.grupo])it.suspenso=escolhas[it.grupo]!==x.id;if(it.diasMax)it.dataIni=day;if(it.doseD1!=null&&!gato){it.doseManut=it.dose;it.dose=it.doseD1;it.dataIni=day}delete it.doseD1;if(gato){if(it.doseGato!=null)it.dose=it.doseGato;if((it.horariosGato||[]).length){it.freq='fixo';it.horarios=it.horariosGato}if(it.suspensoGato)it.suspenso=true}delete it.doseGato;delete it.horariosGato;delete it.suspensoGato;return it}),peso)}
async function launchItens(pid,day,peso,existing,novos,extra){const ref=S.db.doc(`prescricoes/${pid}_${day}`);extra=extra||{};
  if(existing)await ref.update({itens:sortItens([...(existing.itens||[]),...novos]),...(extra.prescritor?{prescritor:extra.prescritor}:{}),...(extra.obs?{obs:[existing.obs,extra.obs].filter(Boolean).join('\n')}:{}),editadoEm:nowDT()});
  else await ref.set({internacaoId:pid,data:day,peso:peso||null,itens:sortItens(novos),obs:extra.obs||'',prescritor:extra.prescritor||null,criadoEm:nowDT(),criadoPor:S.uid||null});}
async function applyProt(protId,pid,day,peso,existing,especie,escolhas){const pt=byId(S.prots,protId);if(!pt)return;
  await launchItens(pid,day,peso,existing,buildProt(pt,especie||byId(S.intern,pid)?.especie,escolhas,day,peso).filter(it=>!it.suspenso),{obs:'Protocolo: '+pt.nome})}

   ${S.equipe.length?'':'<div class="banner info small">Cadastre a equipe em Cadastros › Equipe para registrar quem prescreveu.</div>'}
  </form><div class="modal-f"><button class="btn" id="rvBack">Voltar</button><span class="spacer"></span><button class="btn pri" id="rvOk">${ic('check')}Lançar na prescrição</button></div>`,'wide xwide');
  const read=()=>{const pe=nv($('#rvPeso').value);return{pe,its:$$('#fRV tr.rv').map(tr=>{const it={...itens[+tr.dataset.i]};it.suspenso=!$('.rvOn',tr).checked;$$('[data-k]',tr).forEach(i=>{const k=i.dataset.k;if(k==='horariosTxt')it.horarios=parseHs(i.value);else if(k==='dose'||k==='taxaKgH')it[k]=nv(i.value);else it[k]=i.value});if(it.tipo==='fluido'&&it.taxaKgH&&pe)it.taxa=Math.round(it.taxaKgH*pe*10)/10;return it})}};
  const upd=()=>{const{pe,its}=read();const rc=recalc(its,pe);$$('#fRV tr.rv').forEach((tr,i)=>{const it=rc[i];tr.classList.toggle('off',it.suspenso);const f=$('.rvFreq',tr);if(f){$('.rvHs',tr).hidden=f.value!=='fixo';$('.rvIni',tr).hidden=['fixo','sn','livre'].includes(f.value)}
    $('.rvVol',tr).textContent=it.tipo==='med'?(it.volume!=null?num(it.volume)+' mL':'—'):it.tipo==='fluido'?(it.taxa?num(it.taxa,1)+' mL/h':'informe o peso'):'—'})};
  $('#fRV').addEventListener('change',e=>{const t=e.target;if(!t.classList.contains('rvOn')||!t.checked)return;const tr=t.closest('tr');const g=tr.dataset.g;if(g)$$('#fRV tr.rv').forEach(o=>{if(o!==tr&&o.dataset.g===g)$('.rvOn',o).checked=false})});
  $('#fRV').addEventListener('input',upd);$('#fRV').addEventListener('change',upd);upd();

  $('#rvOk').onclick=async()=>{const pres=$('#rvPresc').value;if(!pres&&S.equipe.length){toast('Selecione quem prescreveu');$('#rvPresc').focus();return}
    const{pe,its}=read();const bad=its.find(it=>!it.suspenso&&it.tipo!=='fluido'&&it.freq==='fixo'&&!(it.horarios||[]).length);if(bad){toast('Informe os horários de '+bad.nome);return}
    const novos=recalc(its,pe).filter(it=>!it.suspenso).map(it=>{if(it.medId){const m=byId(S.meds,it.medId);if(m)it.ref=m.ref||null}if(it.autCanal)it.autTutor={status:'autorizado',canal:it.autCanal,em:nowDT(),por:pres||null};delete it.autCanal;return it});
    if(!novos.length){toast('Marque pelo menos um item para lançar');return}
    if(pres)lsSet('vp_presc',pres);
    const exSel=$$('.rvEx:checked').map(x=>x.value);const alSel=$$('.rvAl:checked').map(x=>x.value);
    try{await launchItens(p.id,S.day,pe,S.pPresc[S.day],novos,{prescritor:pres||null,obs:$('#rvObs').value.trim()});if(pe&&!p.peso)try{await S.db.doc('internacoes/'+p.id).update({peso:pe})}catch(_){}
      if(pt.alta||pt.dias||(pt.exames||[]).length||pt.planoObs||(pt.alertas||[]).length)try{await S.db.doc('internacoes/'+p.id).update({planos:[...(p.planos||[]).filter(x=>x.protocolo!==pt.nome),{protocolo:pt.nome,alta:pt.alta||'',dias:pt.dias||'',exames:pt.exames||[],obs:pt.planoObs||'',inicio:S.day,em:nowDT()}]})}catch(_){}
      if(alSel.length)try{await S.db.doc('internacoes/'+p.id).update({orientacoes:[...(byId(S.intern,p.id)?.orientacoes||p.orientacoes||[]),...alSel.map(t=>({id:rid(),texto:t,autor:pres||null,em:nowDT(),origem:'Protocolo: '+pt.nome}))]})}catch(_){}
      for(const ex of exSel)try{await S.db.collection('solicitacoes').doc().set({tipo:exTipo(ex),item:ex,urgencia:'Rotina',solicitante:pres||null,em:nowDT(),status:'Solicitado',tutor:'Pendente',internacaoId:p.id,origem:'Protocolo: '+pt.nome,criadoPor:S.uid||null})}catch(_){}
      closeModal();toast('Prescrição lançada'+(exSel.length?` · ${exSel.length} exame(s) solicitado(s)`:''))}catch(e){fail(e)}};
}


/* Mapa do paciente */
function tabMapa(p){
  const d=S.day;const pr=S.pPresc[d];const mk=S.pExec[d]||{};
  if(!pr)return`<div class="panel"><div class="panel-h"><h2>Mapa de execução</h2><span class="spacer"></span>${dayNav(p)}</div>${emptyBox('grid','Sem prescrição para '+fmtD(d),'O mapa é montado a partir da prescrição do dia.',`<button class="btn pri" data-act="tab" data-t="prescricao">Ir para a prescrição</button>`)}</div>`;
  const nh=d===today()?new Date().getHours():-1;const H=[...Array(24).keys()];
  const rows=(pr.itens||[]).filter(it=>!it.suspenso).map(it=>{
    const hs=horarios(it);const sn=it.tipo!=='fluido'&&it.freq==='sn';
    const adhoc=Object.keys(mk).filter(k=>k.startsWith(it.id+'|')&&mk[k]&&!hs.includes(k.split('|')[1])).map(k=>k.split('|')[1]);
    const cells=H.map(h=>{const hh=pad(h);const here=[...hs,...adhoc].filter(x=>x.startsWith(hh+':')).sort();
      const inner=here.map(x=>{const m=mk[it.id+'|'+x];const st=status(d,x,m);const r=m&&m.resp?initials(equipeNome(m.resp)):'';return`<span class="mk ${st}">${st==='nao'?'✕ ':''}${x}</span>${r?`<span class="mk ini">${esc(r)}</span>`:''}`}).join('');
      if(here.length)return`<td class="${h===nh?'now':''}"><button class="cell" data-act="exec" data-pid="${p.id}" data-day="${d}" data-item="${it.id}" data-h="${here[0]}" ${W()} aria-label="${esc((it.nome||'Fluidoterapia')+' '+here[0])}">${inner}</button></td>`;
      if(sn)return`<td class="${h===nh?'now':''}"><button class="cell sn" data-act="exec" data-pid="${p.id}" data-day="${d}" data-item="${it.id}" data-h="${hh}:00" data-new="1" ${W()} aria-label="Registrar ${esc(it.nome)} às ${hh}h"></button></td>`;
      return`<td class="${h===nh?'now':''}"></td>`}).join('');
    return`<tr><th class="lbl" scope="row"><b>${it.tipo==='fluido'?'Fluidoterapia':esc(it.nome)}</b>${autChip(it)}<small>${it.tipo==='fluido'?esc(it.soro)+' · '+num(it.taxa,1)+' mL/h':it.tipo==='proc'?esc(freqLbl(it.freq)):it.tipo==='alim'?esc((it.qtd!=null?num(it.qtd)+' '+it.qtdUn:it.qtdUn||'')+' · '+freqLbl(it.freq)):`${it.volume!=null?num(it.volume)+' mL':num(it.dose,3)+' '+esc(it.doseUn)} · ${esc(it.via)}${sn?' · SN':''}`}</small></th>${cells}</tr>`}).join('');
  // registro do dia
  const logs=Object.entries(mk).filter(([k,v])=>v&&v.s).map(([k,v])=>{const[id,h]=k.split('|');const it=(pr.itens||[]).find(x=>x.id===id);return{h:v.hora||h,prev:h,it,v}}).sort((a,b)=>a.h.localeCompare(b.h));
  let tot=0,ok=0;for(const it of pr.itens||[])for(const h of horarios(it)){tot++;if(mk[it.id+'|'+h]?.s)ok++}
  return`<div class="panel">
   <div class="panel-h"><h2>Mapa de execução</h2>${dayNav(p)}<span class="spacer"></span><span class="chip brand tnum">${ok}/${tot} registrados</span></div>
   <div class="panel-b legend" style="padding-block:10px"><span class="mk ok">08:00</span>feito<span class="mk nao">✕ 08:00</span>não feito<span class="mk late">08:00</span>atrasado<span class="mk pend">08:00</span>a fazer<span class="mk ini">AB</span>iniciais de quem aplicou<span class="spacer"></span><span class="muted">Toque no horário para registrar</span></div>
   <div class="map-wrap"><table class="map"><thead><tr><th class="lbl">Item</th>${H.map(h=>`<th class="${h===nh?'now':''}">${pad(h)}h</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>
  </div>
  <div class="panel" style="margin-top:16px"><div class="panel-h"><h2>Registro do dia</h2><span class="muted small">quem fez, quando e intercorrências</span></div>
   ${logs.length?`<div class="log">${logs.map(l=>`<div><span class="mono">${esc(l.h)}</span><span><b>${l.it?(l.it.tipo==='fluido'?'Fluidoterapia':esc(l.it.nome)):'Item removido'}</b> ${l.v.s==='nao'?'<span class="chip crit">não realizado</span>':''} ${l.v.aceit?`<span class="chip ${l.v.aceit==='Recusou'?'crit':l.v.aceit==='Comeu tudo'?'ok':'warn'}">${esc(l.v.aceit)}</span> `:''}${l.v.interc&&l.v.interc!=='Nenhuma'?`<span class="chip warn">${esc(l.v.interc)}</span>`:''}${l.v.obs?`<div class="muted small">${esc(l.v.obs)}</div>`:''}${l.prev!==l.h?`<div class="muted small">previsto ${esc(l.prev)}</div>`:''}</span><span class="small">${l.v.resp?esc(equipeNome(l.v.resp)):'<span class="muted">sem responsável</span>'}</span></div>`).join('')}</div>`:'<div class="panel-b muted">Nenhum registro neste dia.</div>'}
  </div>`;
}

function procWire(){

    opts=S.modelos.filter(m=>!qn||norm(m.nome+' '+(m.categoria||'')).includes(qn)).sort((a,b)=>String(a.categoria||'').localeCompare(String(b.categoria||''))||a.nome.localeCompare(b.nome));
    const L=$('#procList');act=Math.min(act,Math.max(0,opts.length));let cat=null;
    L.innerHTML=opts.map((m,i)=>{const h=(m.categoria||'Outros')!==cat?`<div class="ac-cat">${esc(cat=(m.categoria||'Outros'))}</div>`:'';return h+`<button type="button" data-i="${i}" class="${i===act?'act':''}"><span><b>${hl(m.nome,q)}</b></span></button>`}).join('')+`<button type="button" data-i="blank" class="new">${ic('plus')} ${q?`Procedimento “${esc(q)}” em branco`:'Procedimento em branco'}</button>`;
    L.hidden=false};
  const pick=i=>{const m=i==='blank'?{nome:inp.value.trim()||'',texto:'',id:null}:opts[i];if(!m)return;
    $('#blkEmpty')?.remove();const n=$$('#blocos .cblock').length;$('#blocos').insertAdjacentHTML('beforeend',blocoHTML({id:rid(),modeloId:m.id,nome:m.nome,texto:m.texto},n,n+1));renumBlocos();

  inp.addEventListener('input',()=>{act=0;show()});inp.addEventListener('focus',show);
  inp.addEventListener('keydown',e=>{const L=$('#procList');if(L.hidden)return;const bs=$$('button',L);

  $('#procList').addEventListener('mousedown',e=>{const b=e.target.closest('button');if(b){e.preventDefault();pick(b.dataset.i==='blank'?'blank':+b.dataset.i)}});

/* Linha do tempo */
function tabLinha(p){
  const start=p.entrada?p.entrada.slice(0,10):today();const end=p.status==='alta'&&p.saida?p.saida.slice(0,10):today();
  const days=[];for(let d=start;d<=end&&days.length<120;d=addDays(d,1))days.push(d);
  const cirs=S.pCir;
  return`<div class="panel"><div class="panel-h"><h2>Linha do tempo da internação</h2><span class="muted small">${days.length} dia(s) · ${fmtD(start)} a ${fmtD(end)}</span></div><div class="tl">
   ${days.reverse().map((d,i)=>{const pr=S.pPresc[d];const mk=S.pExec[d]||{};let tot=0,ok=0,nao=0,inter=0;
     if(pr)for(const it of pr.itens||[])for(const h of horarios(it)){tot++;const m=mk[it.id+'|'+h];if(m?.s==='ok')ok++;if(m?.s==='nao')nao++}
     for(const v of Object.values(mk))if(v&&v.interc&&v.interc!=='Nenhuma')inter++;
     const cs=cirs.filter(c=>(c.data||'').slice(0,10)===d);
     const dn=Math.round((parseD(d)-parseD(start))/864e5)+1;
     return`<div class="tl-d"><div class="dd">${fmtD(d)}<small>${wd(d)} · ${dn}º dia</small></div>
      <div class="mid row">${pr?`<span class="chip brand">${(pr.itens||[]).length} itens prescritos</span><span class="chip ${ok===tot&&tot?'ok':''} tnum">${ok}/${tot} feitos</span>${nao?`<span class="chip crit">${nao} não feito(s)</span>`:''}${inter?`<span class="chip warn">${inter} intercorrência(s)</span>`:''}`:'<span class="chip warn">Sem prescrição</span>'}
       ${cs.map(c=>`<span class="chip info">${ic('scalp')}${esc(c.titulo||'Cirurgia')}</span>`).join('')}${(n=>n?`<span class="chip ${n>=3?'ok':'warn'}">${ic('thermo')}${n} avaliação(ões)</span>`:'')(S.pEvo.filter(e=>e.data===d).length)}${(n=>n?`<span class="chip crit">${ic('flag')}${n} intercorrência(s)</span>`:'')(S.pInter.filter(x=>x.data===d).length)}${(n=>n?`<span class="chip">${n} comunicação(ões)</span>`:'')(S.pComm.filter(x=>String(x.em).slice(0,10)===d).length)}${S.pMon[d]?`<span class="chip info">${ic('monitor')}Semi: ${Object.values(S.pMon[d].horas||{}).filter(Boolean).length}/24 h</span>`:''}${d===start?'<span class="chip">Admissão</span>':''}${p.status==='alta'&&d===end?(l=>`<span class="chip ${l[1]}">Saída: ${esc(l[0])}</span>`)(saidaLabel(p)):''}</div>
      <div class="row"><button class="btn sm" data-act="goDay" data-d="${d}" data-t="prescricao">Prescrição</button><button class="btn sm" data-act="goDay" data-d="${d}" data-t="mapa">Mapa</button></div></div>`}).join('')}
  </div></div>`;
}

      ${kind==='prot'?`<div class="spanall gatobox"><b class="small">Para gatos (deixe em branco se for igual)</b><div class="grid g3"><label class="f">Dose para gatos<input class="inp tnum" name="doseGato" inputmode="decimal" value="${esc(it.doseGato??'')}"></label><label class="f">Horários para gatos<input class="inp mono" name="horariosGatoTxt" value="${esc((it.horariosGato||[]).join(', '))}" placeholder="08:00, 20:00"></label><label class="f">&nbsp;<span class="row small"><input type="checkbox" name="suspensoGato" ${it.suspensoGato?'checked':''}> Não usar em gatos</span></label></div></div>`:''}

      const r=calc(out.dose,out.doseUn,out.conc,out.concUn,peso);out.total=r?.total??null;out.totalUn=r?.un||null;out.volume=r?.ml!=null?Math.round(r.ml*100)/100:null;out.medId=picked||null;
      const m=byId(S.meds,picked);out.ref=m?.ref||null;
      if(!picked&&$('#saveNew')?.checked){try{const ref=S.db.collection('medicamentos').doc();await ref.set({nome:out.nome,conc:out.conc,concUn:out.concUn,via:out.via,doseUn:out.doseUn,ref:''});out.medId=ref.id}catch(e){}}}
    if(tipo==='proc'){out.procId=picked||null;if(!picked&&$('#saveNew')?.checked){try{const ref=S.db.collection('procedimentos').doc();await ref.set({nome:out.nome,freq:out.freq,instrucoes:out.obs||''});out.procId=ref.id}catch(e){}}}
    if(tipo==='fluido'){out.taxa=parseFloat(String(fd.taxa).replace(',','.'));out.taxaKgH=nv(fd.taxaKgH);if(!out.taxa){f.taxa.focus();return}out.conferir=Number(fd.conferir)||2;out.manut=!!fd.manut;if(out.manut)out.ate='24h'}
    if(out.diasMax!=null&&out.diasMax!==''){out.diasMax=nv(out.diasMax);if(out.diasMax&&!out.dataIni&&kind!=='prot')out.dataIni=S.day}
    const itens=[...C.itens()];const i=itens.findIndex(x=>x.id===out.id);if(i>=0)itens[i]={...out,criadoUid:itens[i].criadoUid??null,criadoEm:itens[i].criadoEm??null};else itens.push(kind==='prot'?out:{...out,criadoUid:S.uid||null,criadoEm:nowDT()});
    try{await C.save(sortItens(itens));closeModal();toast(kind==='prot'?'Item salvo no protocolo':'Item salvo na prescrição')}catch(e){fail(e)}
  };
}

  if(/\/(h|min)$/.test(du||'')){const per=du.endsWith('/min')?60:1;const r=calc(dose,du.replace(/\/(h|min)$/,''),conc,cu,peso);if(!r)return null;return{ml:r.ml!=null?r.ml*per:null,total:r.total!=null?r.total*per:null,un:r.un,rate:true}}

/* Gráficos da monitorização */
const SERIES=[
 {g:0,k:'fc',l:'FC (bpm)',c:'var(--crit)',pc:[201,48,74],m:'circle'},
 {g:0,k:'pas',l:'PAS (mmHg)',c:'var(--info)',pc:[44,103,219],m:'down'},
 {g:0,k:'pam',l:'PAM (mmHg)',c:'var(--brand)',pc:[10,143,132],m:'square'},
 {g:0,k:'pad',l:'PAD (mmHg)',c:'var(--ink-3)',pc:[120,140,145],m:'up'},
 {g:1,k:'spo2',l:'SpO₂ (%)',c:'var(--ok)',pc:[27,143,78],m:'circle'},
 {g:1,k:'etco2',l:'EtCO₂ (mmHg)',c:'var(--warn)',pc:[180,111,6],m:'square'},
 {g:1,k:'fr',l:'FR (mpm)',c:'var(--info)',pc:[44,103,219],m:'up'},
 {g:2,k:'temp',l:'Temperatura (°C)',c:'var(--warn)',pc:[180,111,6],m:'circle'}];
const CHARTS=[{t:'Hemodinâmica',min:0,max:200,step:50},{t:'Oxigenação e ventilação',min:0,max:100,step:25},{t:'Temperatura',min:34,max:40,step:1}];
const nv=v=>{const x=parseFloat(String(v??'').replace(',','.'));return isNaN(x)?null:x};
function chartData(mon){
  const rows=mon.filter(r=>r.hora).map(r=>({...r,t:toMin(r.hora)}));if(!rows.length)return null;
  const t0=rows[0].t;rows.forEach(r=>{r.x=(r.t-t0+1440)%1440});rows.sort((a,b)=>a.x-b.x);
  return CHARTS.map((ch,gi)=>{const ss=SERIES.filter(s=>s.g===gi).map(s=>({...s,pts:rows.map(r=>({x:r.x,y:nv(r[s.k]),h:r.hora})).filter(p=>p.y!=null)})).filter(s=>s.pts.length);
    let mn=ch.min,mx=ch.max;for(const s of ss)for(const p of s.pts){if(p.y>mx)mx=Math.ceil(p.y/ch.step)*ch.step;if(p.y<mn)mn=Math.floor(p.y/ch.step)*ch.step}
    return{...ch,mn,mx,ss,xmax:Math.max(10,rows[rows.length-1].x),hs:rows.map(r=>({x:r.x,h:r.hora}))}});
}
function mark(m,x,y,c){if(m==='square')return`<rect x="${x-3}" y="${y-3}" width="6" height="6" fill="${c}"/>`;if(m==='up')return`<path d="M${x} ${y-4}L${x+4} ${y+3}L${x-4} ${y+3}Z" fill="${c}"/>`;if(m==='down')return`<path d="M${x} ${y+4}L${x+4} ${y-3}L${x-4} ${y-3}Z" fill="${c}"/>`;return`<circle cx="${x}" cy="${y}" r="3.2" fill="${c}"/>`}
function chartsSVG(mon){
  const D=chartData(mon);if(!D)return`<div class="muted small" style="padding:14px">Os gráficos aparecem assim que houver registros com horário.</div>`;
  return D.filter(c=>c.ss.length).map(c=>{const W=680,Hh=c===D[2]?150:210,l=44,r=30,tp=12,b=26,iw=W-l-r,ih=Hh-tp-b;
    const X=x=>l+x/c.xmax*iw,Y=y=>tp+ih-(y-c.mn)/(c.mx-c.mn)*ih;
    let g='';for(let v=c.mn;v<=c.mx+1e-9;v+=c.step){g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-2)"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${num(v,1)}</text>`}
    const lab=[];let last=-99;for(const h of c.hs){if(X(h.x)-last>38){lab.push(h);last=X(h.x)}}
    g+=lab.map(h=>`<line x1="${X(h.x)}" x2="${X(h.x)}" y1="${tp+ih}" y2="${tp+ih+4}" stroke="var(--ink-3)"/><text x="${X(h.x)}" y="${tp+ih+17}" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--f-mono)">${h.h}</text>`).join('');
    const lines=c.ss.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" points="${s.pts.map(p=>X(p.x)+','+Y(p.y)).join(' ')}"/>${s.pts.map(p=>mark(s.m,X(p.x),Y(p.y),s.c)).join('')}`).join('');

async function createPresc(day,base){const p=curP();const src=base?JSON.parse(JSON.stringify(base)):{itens:[],obs:''};
  const itens0=(src.itens||[]).filter(it=>!it.cancelado).map(it=>{if(it.doseManut!=null&&it.dataIni&&day>it.dataIni&&it.dose!==it.doseManut)it={...it,dose:it.doseManut,obs:it.obs};return it});
  const itens=recalc(itens0,src.peso??p.peso).map(it=>{if(it.diasMax&&it.dataIni&&!it.suspenso&&Math.round((parseD(day)-parseD(it.dataIni))/864e5)>=it.diasMax)return{...it,suspenso:true,obs:((it.obs||'')+` (encerrado: ${it.diasMax} dia(s) completos)`).trim()};return it});
  const doc={internacaoId:p.id,data:day,peso:src.peso??p.peso??null,itens,obs:src.obs||'',prescritor:src.prescritor||null,criadoEm:nowDT(),criadoPor:S.uid||null};
  await S.db.doc(`prescricoes/${p.id}_${day}`).set(doc)}

const EVO_SLOTS=['08:00','15:00','22:00'];
const EVO={
 mucosas:['Normocoradas','Hipocoradas','Pálidas','Hipercoradas','Ictéricas','Cianóticas'],
 dor:['Sem sinais de dor','Dor leve','Dor moderada','Dor intensa'],
 estado:['Estável','Alerta e ativo','Deprimido','Apático / triste','Prostrado','Instável'],

 interacao:['Interage bem','Interage pouco','Não interage'],
 hidratacao:['Normohidratado','Desidratação leve (5%)','Desidratação moderada (6–8%)','Desidratação grave (>8%)'],
 consciencia:['Alerta','Deprimido','Estuporoso','Comatoso'],
 pulso:['Forte e regular','Fraco','Filiforme','Irregular'],
 respiracao:['Eupneico','Taquipneico','Bradipneico','Dispneico','Respiração abdominal','Ofegante'],
 agua:['Bebeu bem','Bebeu pouco','Não bebeu','Restrição hídrica'],
 apetite:['Comeu bem','Comeu pouco','Não comeu','Em jejum','Alimentação por sonda'],
 urina:['Urinou','Não urinou','Sonda vesical'],
 urinaAsp:['Normal','Concentrada','Hematúria','Turva','Poliúria'],
 fezes:['Defecou','Não defecou'],
 fezesAsp:['Consistente / formada','Pastosa','Amolecida','Diarreica'],
 vomito:['Sem vômito','Vomitou'],
};
const EVO_BAD={hidratacao:['Desidratação grave (>8%)'],consciencia:['Estuporoso','Comatoso'],pulso:['Filiforme'],respiracao:['Dispneico'],agua:['Não bebeu'],dor:['Dor moderada','Dor intensa'],estado:['Prostrado','Instável'],apetite:['Não comeu'],urina:['Não urinou'],fezesAsp:['Diarreica'],vomito:['Vomitou'],mucosas:['Pálidas','Ictéricas','Cianóticas'],interacao:['Não interage']};
const EVO_WARN={hidratacao:['Desidratação leve (5%)','Desidratação moderada (6–8%)'],consciencia:['Deprimido'],pulso:['Fraco','Irregular'],respiracao:['Taquipneico','Bradipneico','Respiração abdominal','Ofegante'],agua:['Bebeu pouco'],dor:['Dor leve'],estado:['Deprimido','Apático / triste'],apetite:['Comeu pouco'],fezesAsp:['Amolecida','Pastosa'],mucosas:['Hipocoradas','Hipercoradas'],temperamento:['Agressivo','Agitado'],interacao:['Interage pouco']};
const evoLvl=(k,v)=>!v?'':EVO_BAD[k]?.includes(v)?'crit':EVO_WARN[k]?.includes(v)?'warn':'';
function tempLvl(t){const x=nv(t);if(x==null)return'';return x<37||x>39.7?'crit':x<37.5||x>39.2?'warn':''}
function evoSlots(day,list){
  const slots=EVO_SLOTS.map(h=>({h,e:null}));const ent=[...list].sort((a,b)=>String(a.hora).localeCompare(String(b.hora)));
  for(const e of ent){let best=null,bd=1e9;for(const s of slots){if(s.e)continue;let d=Math.abs(toMin(e.hora)-toMin(s.h));d=Math.min(d,1440-d);if(d<bd&&d<=240){bd=d;best=s}}if(best)best.e=e}
  const t=today();
  return slots.map(s=>({...s,st:s.e?'ok':day<t?'late':day>t?'pend':(toMin(nowHM())>toMin(s.h)+60?'late':'pend')}));
}
const evoOf=(pid,day)=>pid===S.pid?S.pEvo.filter(e=>e.data===day):(day===today()?(S.evoHoje[pid]||[]):[]);
function evoChips(e){
  const c=(k,v,lbl)=>v?`<span class="chip ${evoLvl(k,v)}">${lbl?lbl+' ':''}${esc(v)}</span>`:'';
  const vit=[['T',e.temp,'°C',tempLvl(e.temp)],['FC',e.fc,'bpm',''],['FR',e.fr,'mpm',''],['TPC',e.tpc,'s',''],['SpO₂',e.spo2,'%',semiLvl('spo2',e.spo2)],['PAS',e.pas,'mmHg',semiLvl('pas',e.pas)],['PAM',e.pam,'mmHg',semiLvl('pam',e.pam)],['Glic.',e.glicemia,'mg/dL',semiLvl('glic',e.glicemia)]].filter(x=>x[1]).map(x=>`<span class="vit ${x[3]}"><small>${x[0]}</small><b class="tnum">${esc(x[1])}</b><small>${x[2]}</small></span>`).join('');
  const ur=e.urina?`<span class="chip ${evoLvl('urina',e.urina)||(['Hematúria','Turva'].includes(e.urinaAsp)?'warn':'')}">${esc(e.urina)}${e.urina==='Urinou'&&e.urinaAsp?' · '+esc(e.urinaAsp):''}</span>`:'';
  const fz=e.fezes?`<span class="chip ${e.sangue?'crit':evoLvl('fezesAsp',e.fezesAsp)}">${esc(e.fezes)}${e.fezes==='Defecou'&&e.fezesAsp?' · '+esc(e.fezesAsp):''}${e.sangue?' · com sangue':''}</span>`:'';
  return{vit,chips:[e.escala?`<span class="chip ${e.escala.resgate?'crit':'ok'}">${esc(e.escala.sigla)} ${e.escala.total}/${e.escala.max}${e.escala.resgate?' · resgate indicado':''}</span>`:'',c('mucosas',e.mucosas,'Mucosas'),c('hidratacao',e.hidratacao),c('consciencia',e.consciencia),c('pulso',e.pulso,'Pulso'),c('respiracao',e.respiracao),c('dor',e.dor),c('estado',e.estado),c('temperamento',e.temperamento),c('interacao',e.interacao),c('apetite',e.apetite),c('agua',e.agua,'Água:'),ur,fz,e.vomito==='Vomitou'?c('vomito',e.vomito):''].join('')};
}
function evoCard(e){
  const vit=[['Temperatura',e.temp,'°C',tempLvl(e.temp)],['FC',e.fc,'bpm',''],['FR',e.fr,'mpm',''],['TPC',e.tpc,'s',''],['SpO₂',e.spo2,'%',semiLvl('spo2',e.spo2)],['PAS',e.pas,'mmHg',semiLvl('pas',e.pas)],['PAM',e.pam,'mmHg',semiLvl('pam',e.pam)],['Glicemia',e.glicemia,'mg/dL',semiLvl('glic',e.glicemia)]].filter(x=>x[1]);
  const r=(l,v,lv)=>v?`<div class="er ${lv||''}"><dt>${l}</dt><dd>${lv?'<i></i>':''}${v}</dd></div>`:'';
  const ev=(k,v)=>v?esc(v):'';
  const hid=[...(e.hidVia||[])].map(x=>x==='Via sonda'&&e.hidSondaMl?`Via sonda (${esc(e.hidSondaMl)} mL)`:x==='Fluidoterapia SC'&&e.hidScMl?`Fluidoterapia SC (${esc(e.hidScMl)} mL)`:esc(x)).join(' · ');
  const esc2=e.escala?`${esc(e.escala.sigla)} ${e.escala.total}/${e.escala.max}${e.escala.resgate?' · resgate indicado':''}`:'';
  const secs=[
   ['Exame físico',[r('Estado geral',ev('estado',e.estado),evoLvl('estado',e.estado)),r('Consciência',ev(0,e.consciencia),evoLvl('consciencia',e.consciencia)),r('Mucosas',ev(0,e.mucosas),evoLvl('mucosas',e.mucosas)),r('Hidratação',ev(0,e.hidratacao),evoLvl('hidratacao',e.hidratacao)),r('Pulso',ev(0,e.pulso),evoLvl('pulso',e.pulso)),r('Respiração',ev(0,e.respiracao),evoLvl('respiracao',e.respiracao))]],
   ['Dor',[r('Sinal de dor',ev(0,e.dor),evoLvl('dor',e.dor)),r('Escala',esc2,e.escala?.resgate?'crit':'')]],
   ['Alimentação e hidratação',[r('Apetite',ev(0,e.apetite),evoLvl('apetite',e.apetite)),r('Água',ev(0,e.agua),evoLvl('agua',e.agua)),r('Hidratou-se por',hid,''),r('Vômito',e.vomito==='Vomitou'?'Vomitou':e.vomito?'Sem vômito':'',e.vomito==='Vomitou'?'crit':'')]],
   ['Eliminações',[r('Urina',e.urina?esc(e.urina)+(e.urina==='Urinou'&&e.urinaAsp?' · '+esc(e.urinaAsp):''):'',evoLvl('urina',e.urina)||(['Hematúria','Turva'].includes(e.urinaAsp)?'warn':'')),r('Fezes',e.fezes?esc(e.fezes)+(e.fezes==='Defecou'&&e.fezesAsp?' · '+esc(e.fezesAsp):'')+(e.sangue?' · com sangue':''):'',e.sangue?'crit':evoLvl('fezesAsp',e.fezesAsp))]],
   ['Comportamento',[r('Temperamento',ev(0,e.temperamento),evoLvl('temperamento',e.temperamento)),r('Interação',ev(0,e.interacao),evoLvl('interacao',e.interacao))]]
  ].map(([t,rows])=>[t,rows.join('')]).filter(x=>x[1]);
  return`<div class="evo"><div class="evo-h"><span class="mono evo-t">${esc(e.hora)}</span><span class="row small" style="gap:6px"><span class="av" style="width:24px;height:24px;font-size:10px">${initials(equipeNome(e.avaliador)||'?')}</span>${esc(equipeNome(e.avaliador)||'Sem avaliador')}</span><span class="spacer"></span><button class="btn sm ghost" data-act="evoEdit" data-id="${e.id}" ${W()} aria-label="Editar">${ic('edit')}</button><button class="btn sm ghost danger ${own(e)}" data-act="evoDel" data-id="${e.id}" ${W()} aria-label="Excluir">${ic('trash')}</button></div>
   ${vit.length?`<div class="ev-vits">${vit.map(x=>`<div class="ev-v ${x[3]}"><small>${x[0]}</small><b class="tnum">${esc(x[1])}<span>${x[2]}</span></b></div>`).join('')}</div>`:''}
   ${secs.length?`<div class="ev-secs">${secs.map(([t,h])=>`<section><h5>${t}</h5><dl>${h}</dl></section>`).join('')}</div>`:''}
   ${e.obs?`<div class="ev-obs"><b>Observações</b>${esc(e.obs)}</div>`:''}
   ${(e.imagens||[]).length?`<div class="evo-gal">${e.imagens.map(im=>`<figure><button type="button" class="ph" data-act="fotoView" data-f="${esc(im.id)}" aria-label="Ampliar imagem"><img src="_blob/${esc(im.id)}" alt="${esc(im.legenda||'Imagem da evolução')}" loading="lazy"></button><input type="hidden" data-leg value="${esc((im.hora?im.hora+' · ':'')+(im.legenda||''))}"><figcaption><b class="mono">${esc(im.hora||'')}</b> ${esc(im.legenda||'')}</figcaption></figure>`).join('')}</div>`:''}</div>`}

/* Semi-internamento: monitoração hora a hora, 24h, uma ficha por dia */
const SEMI_P=[
 ['fc','FC','n','bpm'],['fr','FR','n','mpm'],['temp','Temperatura','n','°C'],['pas','PAS','n','mmHg'],['pam','PAM','n','mmHg'],['spo2','SpO₂','n','%'],['tpc','TPC','n','s'],['glic','Glicemia','n','mg/dL'],['lactato','Lactato','n','mmol/L'],['dor','Dor (0–10)','n',''],
 ['mucosas','Mucosas','s',EVO.mucosas],['consc','Consciência','s',['Alerta','Deprimido','Estuporoso','Comatoso']],['padResp','Padrão respiratório','s',EVO.respiracao],['pulso','Pulso','s',EVO.pulso],
 ['diurese','Diurese','n','mL'],['fezes','Fezes','s',['Não','Normais','Pastosas','Diarreicas','Com sangue','Melena']],['vomito','Vômito','s',['Não','Sim','Regurgitação']],['agua','Água','s',EVO.agua],['alim','Alimento','s',['Não ofertado','Comeu tudo','Comeu parte','Recusou']],['fluido','Fluido infundido','n','mL'],['obs','Observações','t','']];
function semiLvl(k,v){const x=nv(v);if(v==null||v==='')return'';
  if(k==='temp')return tempLvl(v);if(k==='spo2'&&x!=null)return x<90?'crit':x<95?'warn':'';if(k==='pam'&&x!=null)return x<60?'crit':x<70?'warn':'';if(k==='pas'&&x!=null)return x<80?'crit':x<90||x>180?'warn':'';
  if(k==='glic'&&x!=null)return x<60||x>300?'crit':x<80||x>200?'warn':'';if(k==='lactato'&&x!=null)return x>4?'crit':x>2.5?'warn':'';if(k==='dor'&&x!=null)return x>=7?'crit':x>=4?'warn':'';if(k==='tpc'&&x!=null)return x>2.5?'warn':'';
  if(k==='mucosas')return evoLvl('mucosas',v);if(k==='consc')return v==='Alerta'?'':v==='Deprimido'?'warn':'crit';if(k==='padResp')return evoLvl('respiracao',v);if(k==='pulso')return evoLvl('pulso',v);
  if(k==='fezes')return['Com sangue','Melena'].includes(v)?'crit':v==='Diarreicas'?'warn':'';if(k==='vomito')return v==='Não'?'':'crit';if(k==='alim')return v==='Recusou'?'warn':'';return''}
function semiHours(m){const s=toMin(m.inicio||'08:00');return[...Array(24).keys()].map(i=>({i,h:toHM(s+i*60),abs:parseD(m.data).getTime()+(s+i*60)*60000}))}
function semiStats(m,p){const H=m.horas||{};const ent=Object.entries(H).filter(([h,v])=>v);
  const sum=k=>ent.reduce((a,[h,v])=>a+(nv(v[k])||0),0);const peso=nv(m.peso)??p?.peso;
  const nDi=ent.filter(([h,v])=>v.diurese!==''&&v.diurese!=null).length;
  const inT=sum('fluido'),outT=sum('diurese');
  return{n:ent.length,inT,outT,uo:peso&&nDi?outT/peso/nDi:null,peso}}
function tabSemi(p){
  const d=S.day;const m=S.pMon[d];
  if(!m){const hNow=pad(new Date().getHours())+':00';
    return`<div class="panel"><div class="panel-h"><h2>Semi-internamento</h2>${dayNav(p)}</div>
     ${emptyBox('monitor','Sem ficha de semi-internamento em '+fmtD(d),'A ficha cobre 24 horas a partir do horário de início, com registro hora a hora. É uma ficha por dia.',`<div class="row" style="justify-content:center"><label class="row small">Início<select class="inp" id="semiIni" style="width:auto">${[...Array(24).keys()].map(i=>`<option ${pad(i)+':00'===hNow?'selected':''}>${pad(i)}:00</option>`).join('')}</select></label><label class="row small">Peso<input class="inp tnum" id="semiPeso0" style="width:80px" inputmode="decimal" value="${esc(p.peso??'')}"> kg</label><button class="btn pri" data-act="semiStart" ${W()}>${ic('plus')}Iniciar ficha de 24h</button></div>`)}</div>`}
  const hs=semiHours(m);const H=m.horas||{};const now=Date.now();
  const cur=hs.find(x=>now>=x.abs&&now<x.abs+3600000);
  const st=semiStats(m,p);const rows=hs.filter(x=>H[x.h]).map(x=>({...H[x.h],hora:x.h}));
  const nextDue=hs.find(x=>!H[x.h]&&x.abs<=now)||null;const fim=toHM(toMin(m.inicio)+1440);
  const tile=(l,v,cls='')=>`<div class="tile ${cls}"><small>${l}</small><b class="tnum">${v}</b></div>`;
  const uoC=st.uo==null?'':st.uo<0.5?'crit':st.uo<1?'warn':'ok';
  const grid=`<div class="map-wrap"><table class="map semi"><thead><tr><th class="lbl">Parâmetro</th>${hs.map(x=>`<th class="${cur&&cur.h===x.h?'now':''}"><button type="button" class="hbtn" data-act="semiHour" data-h="${x.h}" ${W()}>${x.h.slice(0,2)}h</button></th>`).join('')}</tr></thead><tbody>
    ${SEMI_P.filter(q=>q[2]!=='t').map(([k,l,t,u])=>`<tr><th class="lbl" scope="row"><b>${l}</b>${t==='n'&&u?`<small>${u}</small>`:''}</th>${hs.map(x=>{const v=H[x.h]?.[k];const late=!H[x.h]&&x.abs+1800000<now;return`<td class="${cur&&cur.h===x.h?'now':''} ${late?'miss':''}"><button class="cell" type="button" data-act="semiHour" data-h="${x.h}" ${W()} aria-label="${l} às ${x.h}">${v!=null&&v!==''?`<span class="sv ${semiLvl(k,v)}">${esc(t==='s'?String(v).split(/[ /]/)[0].slice(0,9):v)}</span>`:''}</button></td>`}).join('')}</tr>`).join('')}
    <tr><th class="lbl" scope="row"><b>Responsável</b></th>${hs.map(x=>`<td class="${cur&&cur.h===x.h?'now':''}"><button class="cell" type="button" data-act="semiHour" data-h="${x.h}" ${W()}>${H[x.h]?`<span class="mk ini">${esc(initials(equipeNome(H[x.h].resp)||'?'))}</span>`:''}</button></td>`).join('')}</tr>
   </tbody></table></div>`;
  const obs=rows.filter(r=>r.obs);
  return`<div class="panel">
   <div class="panel-h"><h2>Semi-internamento</h2>${dayNav(p)}<span class="spacer"></span><span class="muted small">${esc(m.inicio)} às ${fim} (24h)</span>
    <label class="row small muted" for="semiPeso">Peso<input id="semiPeso" class="inp tnum" style="width:74px;padding:5px 8px" inputmode="decimal" value="${esc(m.peso??'')}" ${W()}> kg</label>
    <button class="btn pri" data-act="semiHour" data-h="${(cur&&!H[cur.h]?cur:nextDue||cur||hs[0]).h}" ${W()}>${ic('plus')}Registrar ${(cur&&!H[cur.h]?cur:nextDue||cur||hs[0]).h}</button></div>
   <div class="panel-b tiles">${tile('Horas registradas',`${st.n}/24`,st.n>=24?'ok':'')}${tile('Fluido infundido',num(st.inT,0)+' mL')}${tile('Diurese',num(st.outT,0)+' mL')}${tile('Débito urinário',st.uo==null?'—':num(st.uo,2)+' mL/kg/h',uoC)}${tile('Balanço (fluido − diurese)',(st.inT-st.outT>0?'+':'')+num(st.inT-st.outT,0)+' mL')}
    ${nextDue&&(!cur||nextDue.h!==cur.h)?`<div class="banner warn small" style="grid-column:1/-1">Registro pendente desde ${nextDue.h}</div>`:''}</div>
   <div class="panel-b" style="padding-top:0"><div class="charts">${chartsSVG(rows)}</div></div>
   ${grid}
   ${obs.length?`<div class="log" style="border-top:1px solid var(--line-2)">${obs.map(r=>`<div><span class="mono">${esc(r.hora)}</span><span>${esc(r.obs)}</span><span class="small">${esc(equipeNome(r.resp)||'')}</span></div>`).join('')}</div>`:''}
   <div class="panel-b muted small" style="border-top:1px solid var(--line-2)">Toque em qualquer hora da grade para registrar ou corrigir. Valores fora do esperado ficam em amarelo ou vermelho; horas vencidas sem registro ficam marcadas.</div>
  </div>`;
}

async function shrinkImg(file,max=900){const bm=await createImageBitmap(file);const s=Math.min(1,max/Math.max(bm.width,bm.height));const c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}

/* ---- Peso ---- */
const pesagemDia=d=>[0,3].includes(parseD(d).getDay());
const pesoPend=p=>p.status!=='alta'&&pesagemDia(today())&&!(p.pesos||[]).some(x=>x.data===today());
function weightSVG(pesos){
  const pts=[...pesos].sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));if(!pts.length)return'';
  const W=680,Hh=170,l=44,r=20,tp=14,b=28,iw=W-l-r,ih=Hh-tp-b;const ys=pts.map(x=>x.peso);let mn=Math.min(...ys),mx=Math.max(...ys);const pad0=Math.max(.2,(mx-mn)*.25);mn=Math.max(0,mn-pad0);mx=mx+pad0;
  const t0=parseD(pts[0].data).getTime(),t1=Math.max(t0+864e5,parseD(pts[pts.length-1].data).getTime());
  const X=p=>l+(parseD(p.data).getTime()+toMin(p.hora||'12:00')*6e4-t0)/(t1+864e5-t0)*iw,Y=v=>tp+ih-(v-mn)/(mx-mn)*ih;
  let g='';for(let i=0;i<=4;i++){const v=mn+(mx-mn)*i/4;g+=`<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line-2)"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--ink-3)">${num(v,1)}</text>`}
  let last=-99;for(const p of pts){const x=X(p);if(x-last>40){g+=`<text x="${x}" y="${Hh-8}" text-anchor="middle" font-size="11" fill="var(--ink-3)" font-family="var(--f-mono)">${fmtDs(p.data)}</text>`;last=x}}
  const line=`<polyline fill="none" stroke="var(--brand)" stroke-width="2.2" points="${pts.map(p=>X(p)+','+Y(p.peso)).join(' ')}"/>`+pts.map((p,i)=>`<circle cx="${X(p)}" cy="${Y(p.peso)}" r="${i===pts.length-1?4.5:3.2}" fill="var(--brand)"/>`).join('');
  return`<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Curva de peso" style="width:100%;height:auto;display:block">${g}${line}</svg>`;
}
function pesoPanel(p){
  const ps=[...(p.pesos||[])].sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));const first=ps[0],last=ps[ps.length-1];
  const dif=first&&last&&ps.length>1?(last.peso-first.peso):null;const pct=dif!=null?dif/first.peso*100:null;
  return`<div class="panel" style="margin-bottom:16px"><div class="panel-h"><h2>Curva de peso</h2><span class="muted small">Pesagem obrigatória aos domingos e quartas</span><span class="spacer"></span>
   ${last?`<span class="chip brand tnum">Atual ${num(last.peso,2)} kg</span>`:''}${pct!=null?`<span class="chip ${pct<=-5?'crit':pct<0?'warn':'ok'} tnum">${dif>0?'+':''}${num(dif,2)} kg (${pct>0?'+':''}${num(pct,1)}%)</span>`:''}
   <button class="btn sm ${pesoPend(p)?'pri':''}" data-act="pesoNew" ${W()}>${ic('plus')}Registrar peso</button></div>
